<!DOCTYPE html>
<!--
  ====================================================================
  PMP HHHA — Refactor del rewrite editorial (IndexedDB / ExcelJS)
  Archivo base: fec63697-pmphhha1.html (4825 líneas)
  --------------------------------------------------------------------
  CAMBIOS (refactor, sin cambios funcionales):
    · DB · Wrappers `_req(request)` y `_txDone(t,value)` eliminan el
      `new Promise((res,rej)=>{ r.onsuccess…; r.onerror… })` repetido
      en put/get/all/del/clear/putMany/batchWrite. Un solo lugar
      maneja onsuccess/onerror/onabort.
    · D · Helper `equipoDesdeFilaMaestro(fila,id)` es la fuente única
      del mapeo fila-maestro → equipo. Antes el bloque de ~24 campos
      estaba duplicado en `cargarInicial` y en `aplicarDiff`
      (riesgo de drift cada vez que se agrega un campo). Idem
      `celdaMaestroDesdeFila(equipoId,mes,fila)`.
    · D · Constantes `CODIGOS_PROGRAMADOS` (X/R/RA/PM) y
      `CODIGOS_OPERATIVOS` (SI/Cn/FS/BAJA) reemplazan los array
      literales sueltos en validarFechaMP, calcularCumplimiento y
      detectarDiferencias. Predicados `esCodigoProgramado` /
      `esCodigoOperativo` documentan la semántica.
    · UI · Helper `badgeCodigoGrilla(codigo)` centraliza la triple
      condicional `c.codigo === 'PM' ? 'badge-warn' : …` que estaba
      cableada en la plantilla mensual.
  --------------------------------------------------------------------
  CAMBIOS UI (sobre el refactor anterior):
    · UI · Helper `selectResponsable({ id, value, extras })`
      construye un <select> de responsables con la lista oficial de
      técnicos activos (S.tecnicos), opciones extra opcionales
      (típicamente supervisora del servicio) y una opción "Otro…"
      que revela un input de texto libre. Si el valor preseleccionado
      no está en la lista, el select cae a "Otro…" automáticamente
      preservando el texto previo (no rompe pendientes históricos).
    · Modal "Nuevo pendiente" · El input libre del responsable pasa
      a select de técnicos. Evita typos y unifica nombres
      (antes "C. Beltrán" / "Cristian Beltran" / "Cristián B."
      coexistían y no agrupaban en informes).
    · Modal "Solicitud de trabajo SIGEM" · Idem, con la supervisora
      del servicio prepoblada como opción extra (no es técnico SEC
      pero es quien gestiona el folio). La opción "Otro…" cubre
      cualquier caso atípico sin perder la guía del select.
    · Panel de gestión del pendiente · El responsable ahora es
      editable (antes era solo lectura). Reasignar deja entrada
      automática en el log: "Responsable: X → Y" y dispara evento
      PENDIENTE_ACTUALIZADO. Útil cuando rota el técnico asignado.
  --------------------------------------------------------------------
  CAMBIOS Vista Inventario:
    · Columna "Id" visible (primera columna, 8 chars del UUID en
      mono). Tooltip con el id completo + click copia al clipboard
      sin disparar la navegación de la fila. Útil para trazabilidad
      de bugs y referencias cruzadas con exportaciones.
    · `D.esSlot` ya no oculta equipos con marca/modelo/carpeta —
      solo son slots los placeholders verdaderos (todos los campos
      vacíos o serie/inv = DISPONIBLE). Un equipo con marca pero
      sin serie ya no se invisibiliza.
    · `D.esSlot` y la persistencia del inventario usan `??` en
      vez de `||` — el valor 0 (cero numérico o "0" literal) deja
      de tratarse como vacío. Un equipo con inventario "0" se
      guarda como "0" y aparece en la lista (antes se perdía
      en `fila.numeroInventario || null`).
    · Buscador del inventario matchea también por id parcial
      (los primeros 8 chars que ven en pantalla).
  Validación: 18/18 casos en sandbox (slot puro, inv=0 string/number,
  marca sin serie, DISPONIBLE/DISPONIBLE, equipo real frecuente).
  ====================================================================
-->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMP HHHA — Sistema de Mantención Preventiva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #F5F2EC;
  --bg-soft:   #EFEAE0;
  --surface:   #FFFFFF;
  --surface-2: #FAF7F1;
  --ink:       #14110D;
  --ink-2:     #5E5A52;
  --ink-3:     #8E8A82;
  --ink-4:     #B5B0A6;
  --line:      #E2DCD0;
  --line-soft: #EFEAE0;
  --line-hard: #C9C1B1;

  --accent:    #A8331F;
  --accent-soft: #F2DDD7;
  --ok:        #2E5E3A;
  --ok-soft:   #DCE8DC;
  --warn:      #B4791E;
  --warn-soft: #F3E4C7;
  --cool:      #345572;
  --cool-soft: #D8E1E9;
  --muted:     #8E8A82;
  --muted-soft:#E8E4DC;

  --r-sm: 4px;
  --r-md: 6px;
  --r-lg: 10px;

  --shadow-sm: 0 1px 2px rgba(20,17,13,.04), 0 1px 1px rgba(20,17,13,.03);
  --shadow-md: 0 4px 16px rgba(20,17,13,.06), 0 1px 2px rgba(20,17,13,.04);
  --shadow-lg: 0 12px 40px rgba(20,17,13,.12), 0 4px 8px rgba(20,17,13,.06);

  --font-display: 'Fraunces', Georgia, serif;
  --font-ui:      'Inter Tight', system-ui, sans-serif;
  --font-mono:    'JetBrains Mono', ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-ui);
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }

/* ===== APP SHELL ===== */
.app {
  display: grid;
  grid-template-columns: 240px 1fr;
  grid-template-rows: 56px 1fr 32px;
  grid-template-areas:
    "brand top"
    "nav   main"
    "nav   foot";
  min-height: 100vh;
}
.brand {
  grid-area: brand;
  display: flex;
  align-items: center;
  padding: 0 20px;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.brand-mark {
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 500;
  font-size: 22px;
  letter-spacing: -0.01em;
}
.brand-mark::after { content: '·'; margin: 0 6px; color: var(--accent); }
.brand-sub {
  font-family: var(--font-mono); font-size: 10px;
  text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3);
}

.topbar {
  grid-area: top;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  gap: 16px;
}
.topbar-title {
  font-family: var(--font-display); font-weight: 500; font-size: 18px; letter-spacing: -0.01em;
}
.topbar-right {
  display: flex; gap: 16px; align-items: center;
}
.topbar-meta {
  display: flex; gap: 16px; align-items: center;
  font-family: var(--font-mono); font-size: 11px; color: var(--ink-2);
  text-transform: uppercase; letter-spacing: 0.06em;
}
.topbar-meta b { color: var(--ink); font-weight: 600; }

.rec-btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px;
  border: 1px solid var(--line-hard);
  border-radius: 999px;
  background: var(--surface);
  cursor: pointer;
  font-family: var(--font-mono); font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.08em;
  transition: all .15s;
}
.rec-btn:hover { background: var(--bg-soft); border-color: var(--ink-3); }
.rec-btn .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent);
  transition: all .15s;
}
.rec-btn.is-recording {
  background: var(--accent); color: var(--surface); border-color: var(--accent);
}
.rec-btn.is-recording .dot {
  background: var(--surface);
  animation: pulse 1.2s infinite;
}
@keyframes pulse {
  0%,100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.7); }
}

.rec-floater {
  position: fixed; bottom: 20px; left: 20px;
  background: var(--accent); color: var(--surface);
  padding: 10px 16px;
  border-radius: var(--r-md);
  font-family: var(--font-mono); font-size: 11px;
  display: none; gap: 10px; align-items: center;
  box-shadow: var(--shadow-md);
  z-index: 200;
}
.rec-floater.is-on { display: flex; }
.rec-floater .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--surface);
  animation: pulse 1.2s infinite;
}

.nav {
  grid-area: nav;
  background: var(--surface);
  border-right: 1px solid var(--line);
  padding: 16px 12px;
  display: flex; flex-direction: column; gap: 2px;
  overflow-y: auto;
}
.nav-section {
  font-family: var(--font-mono); font-size: 10px;
  text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-3);
  padding: 16px 12px 6px;
}
.nav-section:first-child { padding-top: 0; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px;
  border-radius: var(--r-sm);
  color: var(--ink-2);
  font-weight: 500;
  cursor: pointer;
  user-select: none;
  transition: background .12s, color .12s;
}
.nav-item:hover { background: var(--bg-soft); color: var(--ink); }
.nav-item.is-active { background: var(--ink); color: var(--surface); }
.nav-item.is-active .nav-count { color: var(--surface); opacity: .8; }
.nav-item .nav-count {
  margin-left: auto;
  font-family: var(--font-mono); font-size: 11px; color: var(--ink-3);
}
.nav-icon { width: 14px; height: 14px; stroke-width: 1.5; flex-shrink: 0; }

.main { grid-area: main; overflow-y: auto; padding: 24px 28px; }

.foot {
  grid-area: foot;
  background: var(--surface); border-top: 1px solid var(--line);
  display: flex; align-items: center; padding: 0 24px; gap: 24px;
  font-family: var(--font-mono); font-size: 10px;
  text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3);
}
.foot b { color: var(--ink); font-weight: 600; }

/* ===== PAGE HEAD ===== */
.page-head {
  display: flex; justify-content: space-between; align-items: flex-end;
  margin-bottom: 20px; gap: 24px; flex-wrap: wrap;
}
.page-title {
  font-family: var(--font-display); font-weight: 500; font-size: 28px;
  letter-spacing: -0.02em; margin: 0; line-height: 1.1;
}
.page-title em { font-style: italic; color: var(--accent); }
.page-sub {
  font-family: var(--font-mono); font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3);
  margin-top: 6px;
}
.page-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* ===== BUTTONS ===== */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px;
  border: 1px solid var(--line-hard);
  background: var(--surface);
  color: var(--ink);
  border-radius: var(--r-sm);
  cursor: pointer;
  font-weight: 500; font-size: 13px;
  transition: all .12s;
  white-space: nowrap;
}
.btn:hover { background: var(--bg-soft); border-color: var(--ink-3); }
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn-primary:hover { background: var(--ink-2); border-color: var(--ink-2); }
.btn-danger { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn-danger:hover { background: #8E2A1A; border-color: #8E2A1A; }
.btn-ok { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.btn-ok:hover { background: #234628; border-color: #234628; }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-ghost:hover { background: var(--bg-soft); }
.btn-sm { padding: 4px 9px; font-size: 12px; }
.btn-icon { padding: 6px; }

/* ===== PANELS ===== */
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  margin-bottom: 16px;
}
.panel-head {
  padding: 12px 16px;
  border-bottom: 1px solid var(--line-soft);
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  flex-wrap: wrap;
}
.panel-title {
  font-family: var(--font-display); font-weight: 500; font-size: 15px;
  letter-spacing: -0.005em; margin: 0;
}
.panel-body { padding: 16px; }
.panel-body.dense { padding: 0; }

/* ===== STATS ===== */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  overflow: hidden;
  margin-bottom: 20px;
}
.stat { background: var(--surface); padding: 16px 18px; }
.stat-label {
  font-family: var(--font-mono); font-size: 10px;
  text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--ink-3); margin-bottom: 6px;
}
.stat-value {
  font-family: var(--font-display); font-weight: 500;
  font-size: 26px; letter-spacing: -0.02em;
  color: var(--ink); line-height: 1;
}
.stat-extra { font-family: var(--font-mono); font-size: 11px; color: var(--ink-2); margin-top: 6px; }
.stat.is-clickable { cursor: pointer; transition: background .12s; }
.stat.is-clickable:hover { background: var(--bg-soft); }
.stat-value.is-warn { color: var(--warn); }
.stat-value.is-accent { color: var(--accent); }
.stat-value.is-ok { color: var(--ok); }

/* ===== TABLES ===== */
.table-wrap {
  border: 1px solid var(--line);
  border-radius: var(--r-md);
  background: var(--surface);
  overflow: hidden;
}
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead th {
  background: var(--surface-2);
  text-align: left; padding: 10px 12px;
  font-family: var(--font-mono); font-size: 10px;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--ink-3); font-weight: 600;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
tbody td {
  padding: 9px 12px;
  border-bottom: 1px solid var(--line-soft);
  vertical-align: middle;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr.is-clickable { cursor: pointer; transition: background .1s; }
tbody tr.is-clickable:hover { background: var(--bg-soft); }
tbody tr.is-slot { color: var(--ink-3); }
tbody tr.is-alert { background: #FBE8E2; }
tbody tr.is-alert:hover { background: #F6D6CD; }
tbody tr.is-retiro { background: #F2C0B3; }

td.col-strong, th.col-strong { font-weight: 600; }
td.col-mono { font-family: var(--font-mono); font-size: 12px; }
td.col-num { text-align: right; font-variant-numeric: tabular-nums; }
td.col-shrink, th.col-shrink { width: 1%; white-space: nowrap; }

/* ===== BADGES ===== */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 999px;
  font-size: 11px; font-family: var(--font-mono);
  letter-spacing: 0.04em; font-weight: 500;
  white-space: nowrap;
}
.badge-ok    { background: var(--ok-soft);    color: var(--ok); }
.badge-warn  { background: var(--warn-soft);  color: #7A510E; }
.badge-accent{ background: var(--accent-soft);color: var(--accent); }
.badge-cool  { background: var(--cool-soft);  color: var(--cool); }
.badge-muted { background: var(--muted-soft); color: var(--ink-2); }
.badge-slot  { background: var(--surface-2);  color: var(--ink-4); border: 1px dashed var(--line-hard); }
.badge-dot::before {
  content: ''; display: inline-block;
  width: 6px; height: 6px; border-radius: 50%; background: currentColor;
}

/* ===== FILTERS ===== */
.filterbar {
  display: flex; gap: 8px; margin-bottom: 16px;
  align-items: center; flex-wrap: wrap;
}
.search-input {
  flex: 1; min-width: 220px;
  padding: 8px 12px;
  border: 1px solid var(--line-hard);
  border-radius: var(--r-sm);
  background: var(--surface); font-size: 13px;
  transition: border-color .12s, box-shadow .12s;
}
.search-input:focus {
  outline: none; border-color: var(--ink);
  box-shadow: 0 0 0 3px rgba(20,17,13,.07);
}
.select {
  padding: 7px 28px 7px 10px;
  border: 1px solid var(--line-hard);
  border-radius: var(--r-sm);
  background: var(--surface) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10' fill='none'><path d='M2 4l3 3 3-3' stroke='%2314110D' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>") no-repeat right 8px center;
  appearance: none; font-size: 13px; cursor: pointer;
}
.select:focus { outline: none; border-color: var(--ink); }
.check-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 12px;
  border: 1px solid var(--line-hard);
  border-radius: var(--r-sm);
  background: var(--surface);
  font-size: 13px; cursor: pointer; user-select: none;
}
.check-pill input { margin: 0; }

/* ===== FICHA EQUIPO ===== */
.ficha-grid { display: grid; grid-template-columns: 1fr 360px; gap: 16px; }
@media (max-width: 1100px) { .ficha-grid { grid-template-columns: 1fr; } }

.data-list {
  display: grid; grid-template-columns: max-content 1fr;
  gap: 8px 16px; font-size: 13px;
}
.data-list dt {
  font-family: var(--font-mono); font-size: 10px;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--ink-3); padding-top: 2px;
}
.data-list dd { margin: 0; color: var(--ink); font-weight: 500; }

/* ===== GRILLA ===== */
.grilla {
  display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px;
}
.grilla-cell {
  aspect-ratio: 1.4 / 1;
  border-radius: var(--r-sm);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 4px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  font-family: var(--font-mono); font-size: 11px;
  cursor: pointer;
  transition: transform .1s, border-color .12s;
  position: relative;
}
.grilla-cell:hover { border-color: var(--ink); transform: translateY(-1px); }
.grilla-mes {
  font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--ink-3); margin-bottom: 2px;
}
.grilla-cod { font-weight: 600; color: var(--ink); }
.cod-X    { background: var(--surface-2); }
.cod-R    { background: var(--cool-soft); color: var(--cool); }
.cod-RA   { background: var(--warn-soft); color: #7A510E; }
.cod-PM   { background: #E9DFCB; color: #6F5520; }
.cod-SI   { background: var(--ok-soft); color: var(--ok); }
.cod-C1,.cod-C2,.cod-C3,.cod-C4,
.cod-C5,.cod-C6,.cod-C7,.cod-C8 { background: var(--accent-soft); color: var(--accent); }
.cod-FS   { background: var(--muted-soft); color: var(--ink-2); }
.cod-BAJA { background: var(--ink); color: var(--surface); }
.cod-VACIO { color: var(--ink-4); }

/* ===== TIMELINE / HISTORIAL ===== */
.timeline { display: flex; flex-direction: column; gap: 0; }
.timeline-item {
  display: grid; grid-template-columns: 140px 1fr; gap: 16px;
  padding: 12px 0; border-bottom: 1px solid var(--line-soft);
}
.timeline-item:last-child { border-bottom: none; }
.timeline-fecha {
  font-family: var(--font-mono); font-size: 11px;
  color: var(--ink-2); padding-top: 2px;
  font-weight: 500;
}
.timeline-content { font-size: 13px; line-height: 1.55; color: var(--ink); }
.timeline-content em { font-style: italic; color: var(--ink-2); }
.timeline-content b { color: var(--ink); font-weight: 600; }
.timeline-tipo {
  display: inline-block;
  font-family: var(--font-mono); font-size: 9px;
  text-transform: uppercase; letter-spacing: 0.08em;
  padding: 1px 6px;
  border-radius: 999px;
  background: var(--muted-soft); color: var(--ink-2);
  margin-right: 6px;
}
.timeline-tipo.is-mp { background: var(--ok-soft); color: var(--ok); }
.timeline-tipo.is-causal { background: var(--accent-soft); color: var(--accent); }
.timeline-tipo.is-st { background: var(--warn-soft); color: #7A510E; }
.timeline-tipo.is-rep { background: var(--cool-soft); color: var(--cool); }

/* ===== ALERTAS ===== */
.alert-30, .alert-retiro {
  border-radius: var(--r-md);
  padding: 12px 16px;
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 16px;
}
.alert-30 {
  background: linear-gradient(180deg, #F6D6CD 0%, #F2C0B3 100%);
  border: 1px solid #C97A65; color: #5B1A0C;
}
.alert-30 strong { color: var(--accent); }
.alert-retiro {
  background: var(--accent); color: var(--surface);
  border: 1px solid #6D1F12;
}
.alert-retiro strong { font-weight: 700; }

/* ===== MODAL ===== */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(20,17,13,.4);
  backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center;
  z-index: 100; padding: 24px;
}
.modal {
  background: var(--surface);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-lg);
  max-width: 640px; width: 100%;
  max-height: 90vh; overflow-y: auto;
  border: 1px solid var(--line);
}
.modal-large { max-width: 880px; }
.modal-xlarge { max-width: 1100px; }
.modal-head {
  padding: 16px 20px;
  border-bottom: 1px solid var(--line-soft);
  display: flex; justify-content: space-between; align-items: center;
}
.modal-title {
  font-family: var(--font-display); font-weight: 500;
  font-size: 18px; letter-spacing: -0.01em; margin: 0;
}
.modal-body { padding: 20px; }
.modal-foot {
  padding: 12px 20px;
  border-top: 1px solid var(--line-soft);
  display: flex; justify-content: flex-end; gap: 8px;
  flex-wrap: wrap;
}
.modal-close {
  background: none; border: none; cursor: pointer;
  padding: 4px; color: var(--ink-3);
  font-size: 20px; line-height: 1;
}
.modal-close:hover { color: var(--ink); }

/* ===== FORM ===== */
.field { margin-bottom: 14px; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.label {
  display: block;
  font-family: var(--font-mono); font-size: 10px;
  text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--ink-3); margin-bottom: 4px; font-weight: 600;
}
.label .required { color: var(--accent); }
.input, .textarea {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--line-hard);
  border-radius: var(--r-sm);
  background: var(--surface);
  font-size: 13px;
  transition: border-color .12s, box-shadow .12s;
}
.input:focus, .textarea:focus, .select:focus {
  outline: none; border-color: var(--ink);
  box-shadow: 0 0 0 3px rgba(20,17,13,.07);
}
.textarea { resize: vertical; min-height: 70px; font-family: inherit; }
.select-full { width: 100%; padding: 8px 28px 8px 10px; }
.radio-group { display: flex; gap: 8px; }
.radio-pill {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px;
  border: 1px solid var(--line-hard);
  border-radius: var(--r-sm);
  cursor: pointer;
  font-size: 13px; font-weight: 500;
  background: var(--surface);
  transition: all .12s;
}
.radio-pill input { display: none; }
.radio-pill:hover { background: var(--bg-soft); }
.radio-pill.is-selected { border-color: var(--ink); background: var(--ink); color: var(--surface); }
.radio-pill.is-selected.is-ok { background: var(--ok); border-color: var(--ok); }
.radio-pill.is-selected.is-warn { background: var(--accent); border-color: var(--accent); }

.aviso {
  padding: 10px 14px;
  border-radius: var(--r-sm);
  font-size: 13px;
  display: flex; gap: 8px; align-items: flex-start;
  margin-bottom: 8px;
}
.aviso-warn { background: var(--warn-soft); color: #5C3D08; border-left: 3px solid var(--warn); }
.aviso-info { background: var(--cool-soft); color: #1F384C; border-left: 3px solid var(--cool); }
.aviso-accent { background: var(--accent-soft); color: #6D1F12; border-left: 3px solid var(--accent); }
.aviso-ok { background: var(--ok-soft); color: var(--ok); border-left: 3px solid var(--ok); }

/* ===== TOAST ===== */
.toast-stack {
  position: fixed; bottom: 20px; right: 20px;
  display: flex; flex-direction: column; gap: 8px;
  z-index: 200; max-width: 380px;
}
.toast {
  background: var(--ink); color: var(--surface);
  padding: 10px 14px;
  border-radius: var(--r-sm);
  font-size: 13px;
  box-shadow: var(--shadow-md);
  animation: toastIn .25s ease;
}
.toast.is-ok { background: var(--ok); }
.toast.is-warn { background: var(--warn); }
.toast.is-error { background: var(--accent); }
@keyframes toastIn {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}

/* ===== EMPTY ===== */
.empty {
  text-align: center; padding: 60px 20px; color: var(--ink-3);
}
.empty-title {
  font-family: var(--font-display);
  font-size: 18px; font-weight: 500;
  color: var(--ink); margin-bottom: 6px;
}
.empty-sub { font-size: 13px; }

/* ===== DROPZONE ===== */
.dropzone {
  border: 2px dashed var(--line-hard);
  border-radius: var(--r-lg);
  padding: 40px 20px;
  text-align: center; cursor: pointer;
  background: var(--surface-2);
  transition: border-color .15s, background .15s;
}
.dropzone:hover, .dropzone.is-drag {
  border-color: var(--ink); background: var(--bg-soft);
}
.dropzone-title {
  font-family: var(--font-display); font-size: 17px; font-weight: 500; margin-bottom: 4px;
}
.dropzone-sub {
  font-family: var(--font-mono); font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3);
}

/* ===== TABS ===== */
.tabs {
  display: flex; gap: 0;
  border-bottom: 1px solid var(--line);
  margin-bottom: 16px;
}
.tab {
  padding: 10px 16px;
  cursor: pointer; font-weight: 500; font-size: 13px;
  color: var(--ink-3);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: color .12s;
}
.tab:hover { color: var(--ink); }
.tab.is-active { color: var(--ink); border-bottom-color: var(--accent); }

/* ===== ESLABONES ===== */
.eslabones {
  display: flex; gap: 0;
  margin: 12px 0;
  overflow-x: auto;
}
.eslabon {
  flex: 1; min-width: 100px;
  padding: 10px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  text-align: center;
}
.eslabon + .eslabon { border-left: none; }
.eslabon:first-child { border-radius: var(--r-sm) 0 0 var(--r-sm); }
.eslabon:last-child { border-radius: 0 var(--r-sm) var(--r-sm) 0; }
.eslabon-tipo {
  font-family: var(--font-mono); font-size: 9px;
  text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3);
}
.eslabon-estado { font-size: 11px; font-weight: 600; margin-top: 2px; }
.eslabon.is-completado { background: var(--ok-soft); color: var(--ok); }
.eslabon.is-encurso { background: var(--warn-soft); color: #7A510E; border-color: var(--warn); }
.eslabon.is-pendiente { color: var(--ink-3); }

/* ===== CAUSALES ===== */
.causal-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 8px;
}
.causal-option {
  border: 1px solid var(--line-hard);
  border-radius: var(--r-sm);
  padding: 10px;
  cursor: pointer;
  background: var(--surface);
  font-size: 12px;
  transition: all .12s;
}
.causal-option:hover { background: var(--bg-soft); }
.causal-option.is-selected { border-color: var(--accent); background: var(--accent-soft); }
.causal-option-code {
  font-family: var(--font-mono); font-weight: 600; font-size: 11px;
  color: var(--accent); margin-bottom: 4px;
}

/* ===== SUBTAREAS / LOG PENDIENTES ===== */
.subtarea {
  display: flex; gap: 8px; align-items: flex-start;
  padding: 6px 0;
  border-bottom: 1px solid var(--line-soft);
}
.subtarea:last-child { border-bottom: none; }
.subtarea input[type=checkbox] {
  margin-top: 3px; cursor: pointer; flex-shrink: 0;
}
.subtarea-texto { flex: 1; font-size: 13px; }
.subtarea.is-done .subtarea-texto { text-decoration: line-through; color: var(--ink-3); }
.subtarea-del {
  background: none; border: none; cursor: pointer;
  color: var(--ink-3); padding: 0 4px;
}
.subtarea-del:hover { color: var(--accent); }

.log-actualizacion {
  border-left: 2px solid var(--cool);
  padding: 6px 0 6px 12px;
  margin-bottom: 8px;
  font-size: 13px;
}
.log-actualizacion-meta {
  font-family: var(--font-mono); font-size: 10px;
  text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3);
  margin-bottom: 2px;
}

/* ===== UTILS ===== */

.flex-between { display: flex; justify-content: space-between; align-items: center; }
.gap-4 { gap: 4px; }
.gap-8 { gap: 8px; }
.gap-12 { gap: 12px; }
.gap-16 { gap: 16px; }

.mt-8 { margin-top: 8px; }
.mt-12 { margin-top: 12px; }
.mt-16 { margin-top: 16px; }
.mb-8 { margin-bottom: 8px; }
.mb-12 { margin-bottom: 12px; }
.mb-16 { margin-bottom: 16px; }

.text-mono { font-family: var(--font-mono); }
.text-sm { font-size: 12px; }
.text-xs { font-size: 11px; }
.text-muted { color: var(--ink-3); }
.text-accent { color: var(--accent); }
.text-ok { color: var(--ok); }
.text-warn { color: var(--warn); }
.text-strong { font-weight: 600; }
.text-center { text-align: center; }
.text-right { text-align: right; }
.serif { font-family: var(--font-display); font-weight: 500; }
.no-mb-last > *:last-child { margin-bottom: 0; }

.loader-bar {
  height: 2px;
  background: var(--line);
  overflow: hidden;
  margin-bottom: 12px;
  border-radius: 999px;
}
.loader-bar::before {
  content: ''; display: block; height: 100%; width: 30%;
  background: var(--accent);
  animation: load 1.4s infinite ease-in-out;
}
@keyframes load {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(400%); }
}

.diff-row {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 8px; padding: 8px 0;
  font-size: 12px;
  border-bottom: 1px solid var(--line-soft);
}
.diff-row > div:first-child { font-weight: 600; }
.diff-old { color: var(--ink-3); text-decoration: line-through; }
.diff-new { color: var(--ok); font-weight: 600; }
.diff-conflict { color: var(--accent); font-weight: 700; }

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════
// 0. UTILIDADES
// ═══════════════════════════════════════════════════════════════
const U = {
  uuid() {
    if (crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
  },

  hoy() { return new Date(); },
  hoyISO() { return U.formatISO(new Date()); },
  formatISO(d) {
    const z = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`;
  },
  formatDDMMAAAA(d) {
    if (typeof d === 'string') d = U.parseISO(d);
    if (!d) return '';
    const z = n => String(n).padStart(2, '0');
    return `${z(d.getDate())}-${z(d.getMonth() + 1)}-${d.getFullYear()}`;
  },
  formatLargo(d) {
    if (typeof d === 'string') d = U.parseISO(d);
    if (!d) return '';
    const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    return `${d.getDate()} de ${meses[d.getMonth()]} de ${d.getFullYear()}`;
  },
  formatDateTime(d) {
    if (typeof d === 'string') d = new Date(d);
    const z = n => String(n).padStart(2, '0');
    return `${z(d.getDate())}-${z(d.getMonth() + 1)}-${d.getFullYear()} ${z(d.getHours())}:${z(d.getMinutes())}`;
  },
  formatDateTimeLargo(d) {
    if (typeof d === 'string') d = new Date(d);
    return `${U.formatLargo(d)} · ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  },
  parseISO(s) {
    if (!s) return null;
    if (s instanceof Date) return s;
    const [y, m, d] = s.split('-').map(Number);
    return new Date(y, m - 1, d);
  },
  ultimoDiaMes(anio, mes) { return new Date(anio, mes, 0); },
  diferenciaEnDias(a, b) {
    const MS = 1000 * 60 * 60 * 24;
    return Math.floor((a.getTime() - b.getTime()) / MS);
  },
  esFinDeSemana(d) {
    if (typeof d === 'string') d = U.parseISO(d);
    const dow = d.getDay();
    return dow === 0 || dow === 6;
  },
  nombreMes(m) {
    return ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'][m - 1];
  },
  nombreMesCorto(m) {
    return ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'][m - 1];
  },

  norm(s) { return (s == null ? '' : String(s)).trim(); },
  normUpper(s) { return U.norm(s).toUpperCase(); },
  isBlank(s) { return U.norm(s) === ''; },
  esValorDisponible(s) { return U.normUpper(s) === 'DISPONIBLE'; },

  el(tag, props = {}, children = []) {
    const e = document.createElement(tag);
    for (const k in props) {
      if (k === 'class') e.className = props[k];
      else if (k === 'style' && typeof props[k] === 'object') Object.assign(e.style, props[k]);
      else if (k.startsWith('on') && typeof props[k] === 'function') e.addEventListener(k.slice(2), props[k]);
      else if (k === 'html') e.innerHTML = props[k];
      else if (props[k] !== null && props[k] !== undefined && props[k] !== false) e.setAttribute(k, props[k]);
    }
    const arr = Array.isArray(children) ? children : [children];
    for (const c of arr) {
      if (c == null || c === false) continue;
      e.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(c) : c);
    }
    return e;
  },

  toast(msg, kind = '') {
    const t = U.el('div', { class: 'toast ' + (kind ? `is-${kind}` : ''), html: msg });
    document.getElementById('toast-root').appendChild(t);
    if (typeof REC !== 'undefined' && REC.activo) REC.log('toast', { msg, kind });
    setTimeout(() => {
      t.style.opacity = '0';
      t.style.transition = 'opacity .3s';
      setTimeout(() => t.remove(), 300);
    }, 4000);
  },

  async confirm(msg, opciones = {}) {
    return new Promise(resolve => {
      const root = document.getElementById('modal-root');
      const backdrop = U.el('div', { class: 'modal-backdrop' });
      const modal = U.el('div', { class: 'modal' });
      modal.style.maxWidth = '460px';
      modal.innerHTML = `
        <div class="modal-head"><h3 class="modal-title">${opciones.titulo || 'Confirmar'}</h3></div>
        <div class="modal-body">${msg}</div>
        <div class="modal-foot">
          <button class="btn" id="cancel">${opciones.cancelar || 'Cancelar'}</button>
          <button class="btn ${opciones.peligroso ? 'btn-danger' : 'btn-primary'}" id="ok">${opciones.confirmar || 'Confirmar'}</button>
        </div>`;
      backdrop.appendChild(modal);
      root.appendChild(backdrop);
      modal.querySelector('#cancel').addEventListener('click', () => { root.removeChild(backdrop); resolve(false); });
      modal.querySelector('#ok').addEventListener('click', () => { root.removeChild(backdrop); resolve(true); });
      backdrop.addEventListener('click', (e) => { if (e.target === backdrop) { root.removeChild(backdrop); resolve(false); } });
    });
  },

  async prompt(label, opciones = {}) {
    return new Promise(resolve => {
      const root = document.getElementById('modal-root');
      const backdrop = U.el('div', { class: 'modal-backdrop' });
      const modal = U.el('div', { class: 'modal' });
      modal.style.maxWidth = '460px';
      modal.innerHTML = `
        <div class="modal-head"><h3 class="modal-title">${opciones.titulo || 'Indicar'}</h3></div>
        <div class="modal-body">
          <div class="field">
            <label class="label">${label}</label>
            ${opciones.multilinea ? `<textarea class="textarea" id="val" rows="3">${opciones.defecto || ''}</textarea>` : `<input class="input" id="val" value="${opciones.defecto || ''}" type="${opciones.tipo || 'text'}">`}
          </div>
        </div>
        <div class="modal-foot">
          <button class="btn" id="cancel">Cancelar</button>
          <button class="btn btn-primary" id="ok">${opciones.confirmar || 'Aceptar'}</button>
        </div>`;
      backdrop.appendChild(modal);
      root.appendChild(backdrop);
      const input = modal.querySelector('#val');
      input.focus();
      modal.querySelector('#cancel').addEventListener('click', () => { root.removeChild(backdrop); resolve(null); });
      const ok = () => { const v = input.value.trim(); root.removeChild(backdrop); resolve(v); };
      modal.querySelector('#ok').addEventListener('click', ok);
      if (!opciones.multilinea) input.addEventListener('keydown', (e) => { if (e.key === 'Enter') ok(); });
      backdrop.addEventListener('click', (e) => { if (e.target === backdrop) { root.removeChild(backdrop); resolve(null); } });
    });
  },

  download(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  },
  downloadJSON(obj, filename) {
    const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
    U.download(blob, filename);
  },

  groupBy(arr, key) {
    const out = {};
    for (const item of arr) {
      const k = typeof key === 'function' ? key(item) : item[key];
      (out[k] = out[k] || []).push(item);
    }
    return out;
  },
  unique(arr) { return [...new Set(arr)]; },
  by(prop) { return (a, b) => (a[prop] > b[prop] ? 1 : a[prop] < b[prop] ? -1 : 0); }
};

    A: ['SOLICITUD','DIAGNOSTICO','REPARACION'],
    B: ['SOLICITUD','DIAGNOSTICO','COMPRA','ENVIO','RECEPCION','REPARACION'],
    C: ['SOLICITUD','DIAGNOSTICO','ENVIO','COMPRA','RECEPCION','REPARACION']
  },

  CODIGOS_GRILLA:      ['X','R','RA','PM','SI','C1','C2','C3','C4','C5','C6','C7','C8','FS','BAJA','VACIO'],
  // Códigos que indican MP programada por el maestro (visibles en la grilla anual).
  CODIGOS_PROGRAMADOS: ['X','R','RA','PM'],
  // Códigos que representan acción operativa registrada (cierran alertas 30d).
  CODIGOS_OPERATIVOS:  ['SI','C1','C2','C3','C4','C5','C6','C7','C8','FS','BAJA'],

  esCodigoProgramado(c) { return D.CODIGOS_PROGRAMADOS.includes(c); },
  esCodigoOperativo(c)  { return D.CODIGOS_OPERATIVOS.includes(c); },

  /**
   * Construye un objeto equipo desde una fila normalizada del maestro.
   * Fuente única para cargarInicial y aplicarDiff (evita drift entre ambas rutas).
   */
  equipoDesdeFilaMaestro(fila, id = U.uuid()) {
    const ahora = new Date().toISOString();
    return {
      id,
      numeroCarpeta:        fila.numeroCarpeta,
      // Preserva inventarios "0" (literal cero) que se pierden con `|| null`
      // cuando el origen del dato es numérico en vez de string.
      numeroInventario:     U.isBlank(fila.numeroInventario) ? null : U.norm(fila.numeroInventario),
      numeroSerie:          U.isBlank(fila.numeroSerie) ? null : U.norm(fila.numeroSerie),
      familia:              fila.familia || 'MONITORIZACION',
      servicioClinico:      fila.servicio,
      unidad:               fila.unidad,
      ubicacionFisica:      fila.ubicacion,
      marca:                fila.marca,
      modelo:               fila.modelo,
      anioAdquisicion:      fila.anioAdq,
      anioInstalacion:      fila.anioInst,
      procedencia:          fila.procedencia,
      vidaUtilResidualMeses:fila.vidaUtil,
      clasificacion:        fila.clasificacion || 'A',
      frecuenciaMeses:      fila.frecuencia || D.PERIODICIDAD_FAMILIA[fila.familia] || 6,
      modalidadMP:          fila.modalidad,
      enGarantia:           fila.garantia,
      fechaFinGarantia:     fila.finGarantia,
      estadoOperacional:    fila.estado || 'OPERATIVO',
      esSlot:               D.esSlot({
                              serie: fila.numeroSerie, inventario: fila.numeroInventario,
                              carpeta: fila.numeroCarpeta, marca: fila.marca, modelo: fila.modelo
                            }),
      observaciones:        fila.observaciones,
      origenRegistro:       'importado',
      creadoEn:             ahora,
      actualizadoEn:        ahora
    };
  },

  /** Celda de grilla maestro para un equipo/mes. */
  celdaMaestroDesdeFila(equipoId, mes, fila) {
    return {
      id:       U.uuid(),
      equipoId, anio: D.ANIO_VIGENTE, mes,
      codigo:   fila.meses[mes] || 'VACIO',
      origen:   'maestro'
    };
  },

  /**
   * Un slot es un placeholder del maestro SIN ningún dato real. Si la fila trae
   * marca, modelo, carpeta o un inventario distinto de '' / DISPONIBLE — es un
   * equipo real con identificación incompleta, NO un slot.
   *
   * Notas:
   *  · Un inventario "0" (cero) cuenta como dato real (equipos sin inventariar
   *    formalmente que en el maestro se marcan con 0).
   *  · Un equipo con carpeta administrativa o marca/modelo registrados no se
   *    oculta aunque le falten serie e inventario.
   */
  esSlot(filaMaestro) {
    // `??` (no `||`) para no perder un inventario o serie con valor 0.
    const serie    = U.norm(filaMaestro.serie     ?? filaMaestro.numeroSerie);
    const inv      = U.norm(filaMaestro.inventario ?? filaMaestro.numeroInventario);
    const carpeta  = U.norm(filaMaestro.carpeta    ?? filaMaestro.numeroCarpeta);
    const marca    = U.norm(filaMaestro.marca);
    const modelo   = U.norm(filaMaestro.modelo);
    if (serie  && !U.esValorDisponible(serie)) return false;
    if (inv    && !U.esValorDisponible(inv))   return false;
    if (carpeta || marca || modelo)            return false;
    return true;
  },

  /** R5: alerta 30 días tras causal Grupo A sin acción posterior. */
  chequearAlerta30Dias(equipo, mantenciones, ciclos, fechaHoy) {
    fechaHoy = fechaHoy || U.hoy();
    const causalesA = mantenciones
      .filter(m => !m.eliminado && m.equipoId === equipo.id)
      .filter(m => typeof m.resultado === 'string' && D.CAUSALES[m.resultado]?.grupo === 'A')
      .sort((a, b) => b.fechaRealEjecucion.localeCompare(a.fechaRealEjecucion));
    if (causalesA.length === 0) return false;
    const ultima = causalesA[0];
    const fechaCausal = U.parseISO(ultima.fechaRealEjecucion);
    const finMesCausal = U.ultimoDiaMes(fechaCausal.getFullYear(), fechaCausal.getMonth() + 1);
    const dias = U.diferenciaEnDias(fechaHoy, finMesCausal);
    if (dias <= 30) return false;
    const fechaUltimaISO = ultima.fechaRealEjecucion;
    const hayMPpost = mantenciones.some(m =>
      !m.eliminado && m.equipoId === equipo.id && m.id !== ultima.id &&
      m.fechaRealEjecucion > fechaUltimaISO);
    const hayCicloPost = ciclos.some(c => c.equipoId === equipo.id && c.fechaApertura > fechaUltimaISO);
    const baja = equipo.estadoOperacional === 'DE_BAJA' || equipo.estadoOperacional === 'FUERA_DE_SERVICIO';
    if (hayMPpost || hayCicloPost || baja) return false;
    return true;
  },

  /** Días que el equipo lleva en una causal específica (C2/C3/C5 etc) */
  diasEnCausal(equipo, mantenciones, causal, fechaHoy) {
    fechaHoy = fechaHoy || U.hoy();
    const ult = mantenciones
      .filter(m => !m.eliminado && m.equipoId === equipo.id && m.resultado === causal)
      .sort((a, b) => b.fechaRealEjecucion.localeCompare(a.fechaRealEjecucion))[0];
    if (!ult) return null;
    const fechaCausal = U.parseISO(ult.fechaRealEjecucion);
    const finMes = U.ultimoDiaMes(fechaCausal.getFullYear(), fechaCausal.getMonth() + 1);
    return U.diferenciaEnDias(fechaHoy, finMes);
  },

  /** Recomendar retiro por seguridad si causal en uso supera 30 días sin acción */
  necesitaRetiroPorSeguridad(equipo, mantenciones, ciclos, fechaHoy) {
    if (equipo.estadoOperacional === 'DE_BAJA' || equipo.estadoOperacional === 'FUERA_DE_SERVICIO') return false;
    // Alguna causal de cualquier grupo con >30 días sin acción posterior
    return D.chequearAlerta30Dias(equipo, mantenciones, ciclos, fechaHoy);
  },

  /** Formato natural del evento para historial. */
  formatearEventoNatural(ev) {
    const fechaTxt = U.formatLargo(ev.marcaTiempo.slice(0,10));
    let texto = '';
    switch (ev.tipo) {
      case 'MP_EJECUTADA': {
        const p = ev.payload || {};
        const estado = p.estadoFinal === 'OPERATIVO' ? 'equipo operativo' : 'equipo no operativo';
        const obs = p.observaciones ? ` Observación: ${p.observaciones}.` : ' Sin observaciones registradas.';
        texto = `Mantención preventiva realizada, ${estado}. Ejecutada por ${ev.responsable}.${obs}`;
        break;
      }
      case 'MP_NO_EJECUTADA_CAUSAL': {
        const p = ev.payload || {};
        const obs = p.observaciones ? ` Observación: ${p.observaciones}.` : '';
        texto = `Mantención no ejecutada — causal ${p.causal}: ${D.CAUSALES[p.causal]?.texto || ''} Registrado por ${ev.responsable}.${obs}`;
        break;
      }
      case 'CAMBIO_ESTADO':       texto = `Estado del equipo cambiado a ${ev.payload?.nuevo || '—'}.`; break;
      case 'RETIRO_SEGURIDAD':    texto = `Equipo retirado por seguridad. ${ev.descripcion || ''}`; break;
      case 'BAJA':                texto = `Equipo dado de baja definitivamente. ${ev.descripcion || ''}`; break;
      case 'SOLICITUD_CORRECTIVA':texto = `Solicitud de trabajo correctiva registrada${ev.payload?.folioSigem ? ` (folio SIGEM ${ev.payload.folioSigem})` : ''}. Responsable: ${ev.responsable}.`; break;
      case 'SOLICITUD_PENDIENTE': texto = `Pendiente de gestión de folio SIGEM. Responsable: ${ev.responsable}.${ev.payload?.fechaCompromiso ? ' Fecha compromiso: ' + U.formatDDMMAAAA(ev.payload.fechaCompromiso) + '.' : ''}`; break;
      case 'DIAGNOSTICO':         texto = `Diagnóstico técnico registrado. ${ev.descripcion || ''}`; break;
      case 'ENVIO_TALLER':        texto = `Equipo enviado a servicio técnico${ev.payload?.proveedor ? ' (' + ev.payload.proveedor + ')' : ''}. Estado: en servicio técnico.`; break;
      case 'RECEPCION_TALLER':    texto = `Equipo recibido desde servicio técnico. ${ev.descripcion || ''}`; break;
      case 'COMPRA_REGISTRADA':   texto = `Compra/cotización registrada. ${ev.descripcion || ''}`; break;
      case 'COMPRA_NO_APROBADA':  texto = `Compra no aprobada. Ciclo correctivo cerrado.`; break;
      case 'REPARACION_COMPLETA': texto = `Reparación completa. Equipo operativo.`; break;
      case 'EDICION_REGISTRO':    texto = `Edición administrativa. ${ev.descripcion || ''}`; break;
      case 'ELIMINACION_REGISTRO':texto = `Eliminación de registro. ${ev.descripcion || ''}`; break;
      case 'VINCULACION_CICLO':   texto = `Vinculado a ciclo correctivo existente.`; break;
      case 'INCONSISTENCIA_DETECTADA': texto = `Inconsistencia detectada: ${ev.descripcion || ''}`; break;
      case 'APLICACION_CAMBIOS_MAESTRO': texto = `Maestro actualizado: ${ev.descripcion || ''}`; break;
      case 'PENDIENTE_CREADO':    texto = `Pendiente operativo creado: ${ev.descripcion || ''}`; break;
      case 'PENDIENTE_CERRADO':   texto = `Pendiente operativo cerrado: ${ev.descripcion || ''}`; break;
      case 'PENDIENTE_ACTUALIZADO': texto = `Actualización a pendiente: ${ev.descripcion || ''}`; break;
      default: texto = ev.descripcion || ev.tipo;
    }
    return { fechaTxt, texto };
  },

  validarFechaMP(equipo, fechaISO, grillaEquipo) {
    const avisos = [];
    const d = U.parseISO(fechaISO);
    const mes = d.getMonth() + 1;
    const cellCode = grillaEquipo[mes - 1]?.codigo || 'VACIO';
    if (!D.esCodigoProgramado(cellCode)) {
      avisos.push({ tipo: 'MES_NO_CORRESPONDE', mensaje: `Este equipo no tenía MP programada en ${U.nombreMes(mes)}.` });
    }
    if (U.esFinDeSemana(d)) {
      avisos.push({ tipo: 'FIN_DE_SEMANA', mensaje: 'Esta fecha es fin de semana.' });
    }
    return avisos;
  },

  calcularCumplimiento(equiposActivos, celdas, mantenciones, anio, mes) {
    let programadas = 0, ejecutadas = 0;
    for (const e of equiposActivos) {
      if (e.esSlot) continue;
      const c = celdas.find(x => x.equipoId === e.id && x.anio === anio && x.mes === mes);
      const cod = c?.codigo || 'VACIO';
      if (D.esCodigoProgramado(cod)) {
        programadas++;
        const mp = mantenciones.find(m =>
          !m.eliminado && m.equipoId === e.id &&
          U.parseISO(m.fechaRealEjecucion).getMonth() + 1 === mes &&
          U.parseISO(m.fechaRealEjecucion).getFullYear() === anio);
        if (mp) {
          if (mp.resultado === 'SI') ejecutadas++;
          else if (D.CAUSALES[mp.resultado]?.grupo === 'B') ejecutadas++;
        }
      }
    }
    return {
      programadas, ejecutadas,
      porcentaje: programadas > 0 ? Math.round((ejecutadas / programadas) * 1000) / 10 : 0
    };
  }
};

// ═══════════════════════════════════════════════════════════════
// 2. PERSISTENCIA (IndexedDB)
// ═══════════════════════════════════════════════════════════════
const DB = {
  _db: null,
  NAME: 'pmp-hhha',
  VERSION: 2,
  STORES: {
    equipos:        { keyPath: 'id' },
    celdasGrilla:   { keyPath: 'id' },
    mantenciones:   { keyPath: 'id' },
    ciclos:         { keyPath: 'id' },
    eslabones:      { keyPath: 'id' },
    pendientes:     { keyPath: 'id' },
    asignaciones:   { keyPath: 'id' },
    contactos:      { keyPath: 'servicioClinico' },
    eventos:        { keyPath: 'id' },
    tecnicos:       { keyPath: 'id' },
    configuracion:  { keyPath: 'clave' }
  },

  async open() {
    if (DB._db) return DB._db;
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB.NAME, DB.VERSION);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        for (const [name, def] of Object.entries(DB.STORES)) {
          if (!db.objectStoreNames.contains(name)) {
            db.createObjectStore(name, { keyPath: def.keyPath });
          }
        }
      };
      req.onsuccess = () => { DB._db = req.result; resolve(DB._db); };
      req.onerror = () => reject(req.error);
    });
  },

  async tx(stores, mode = 'readonly') {
    const db = await DB.open();
    return db.transaction(stores, mode);
  },

  // Promisifica un IDBRequest. mapResult permite traducir el .result (ej. null por defecto).
  _req(request, mapResult = (v) => v) {
    return new Promise((res, rej) => {
      request.onsuccess = () => res(mapResult(request.result));
      request.onerror   = () => rej(request.error);
    });
  },
  // Promisifica una IDBTransaction completa (uso con batches/putMany).
  _txDone(t, value) {
    return new Promise((res, rej) => {
      t.oncomplete = () => res(value);
      t.onerror    = () => rej(t.error);
      t.onabort    = () => rej(t.error);
    });
  },

  async put(store, obj) {
    const t = await DB.tx([store], 'readwrite');
    await DB._req(t.objectStore(store).put(obj));
    return obj;
  },

  async putMany(store, objs) {
    if (!objs || objs.length === 0) return [];
    const t = await DB.tx([store], 'readwrite');
    const os = t.objectStore(store);
    for (const o of objs) os.put(o);
    return DB._txDone(t, objs);
  },

  async get(store, key) {
    const t = await DB.tx([store]);
    return DB._req(t.objectStore(store).get(key), v => v || null);
  },

  async all(store) {
    const t = await DB.tx([store]);
    return DB._req(t.objectStore(store).getAll(), v => v || []);
  },

  async del(store, key) {
    const t = await DB.tx([store], 'readwrite');
    return DB._req(t.objectStore(store).delete(key), () => undefined);
  },

  async clear(store) {
    const t = await DB.tx([store], 'readwrite');
    return DB._req(t.objectStore(store).clear(), () => undefined);
  },

  async clearAll() {
    for (const s of Object.keys(DB.STORES)) await DB.clear(s);
  },

  async batchWrite(operaciones) {
    const stores = U.unique(operaciones.map(o => o.store));
    const t = await DB.tx(stores, 'readwrite');
    for (const op of operaciones) {
      const os = t.objectStore(op.store);
      if (op.tipo === 'put') os.put(op.obj);
      else if (op.tipo === 'delete') os.delete(op.key);
    }
    return DB._txDone(t, true);
  }
};

// 3. ESTADO EN MEMORIA
// ═══════════════════════════════════════════════════════════════
const S = {
  equipos: [], celdas: [], mantenciones: [], ciclos: [], eslabones: [],
  pendientes: [], asignaciones: [], contactos: [], eventos: [], tecnicos: [],
  config: {},

  async hidratar() {
    S.equipos      = await DB.all('equipos');
    S.celdas       = await DB.all('celdasGrilla');
    S.mantenciones = await DB.all('mantenciones');
    S.ciclos       = await DB.all('ciclos');
    S.eslabones    = await DB.all('eslabones');
    S.pendientes   = await DB.all('pendientes');
    S.asignaciones = await DB.all('asignaciones');
    S.contactos    = await DB.all('contactos');
    S.eventos      = await DB.all('eventos');
    S.tecnicos     = await DB.all('tecnicos');
    const cfg = await DB.all('configuracion');
    S.config = Object.fromEntries(cfg.map(c => [c.clave, c.valor]));
  },

  equipoPorId(id) { return S.equipos.find(e => e.id === id); },
  equipoPorSerie(serie) {
    const s = U.normUpper(serie);
    return S.equipos.find(e => U.normUpper(e.numeroSerie) === s);
  },
  celdasDeEquipo(equipoId, anio = D.ANIO_VIGENTE) {
    const out = new Array(12).fill(null).map((_, i) => ({
      mes: i + 1, anio, codigo: 'VACIO', origen: 'sistema'
    }));
    for (const c of S.celdas) {
      if (c.equipoId === equipoId && c.anio === anio) out[c.mes - 1] = c;
    }
    return out;
  },
  mpDeEquipo(equipoId) {
    return S.mantenciones
      .filter(m => m.equipoId === equipoId)
      .sort((a, b) => b.fechaRealEjecucion.localeCompare(a.fechaRealEjecucion));
  },
  ciclosAbiertosDe(equipoId) {
    return S.ciclos.filter(c => c.equipoId === equipoId && c.estado === 'ABIERTO');
  },
  eventosDeEquipo(equipoId) {
    return S.eventos
      .filter(ev => ev.equipoId === equipoId)
      .sort((a, b) => b.marcaTiempo.localeCompare(a.marcaTiempo));
  },
  pendientesAbiertos() {
    return S.pendientes.filter(p => p.estado !== 'CERRADO');
  },
  pendientesDeEquipo(equipoId) {
    return S.pendientes.filter(p => p.equipoId === equipoId);
  },
  /** Busca un pendiente de tipo SOLICITUD_TRABAJO abierto del equipo. */
  solicitudTrabajoAbiertaDe(equipoId) {
    return S.pendientes.find(p => p.equipoId === equipoId && p.tipo === 'SOLICITUD_TRABAJO' && p.estado !== 'CERRADO');
  },
  /** Busca un evento de envío a servicio técnico abierto/reciente. */
  envioSTAbiertoDe(equipoId) {
    // Hay un envío activo si el equipo tiene un eslabón ENVIO sin RECEPCION posterior en ciclos abiertos o si estado = SERVICIO_TECNICO
    const ciclosA = S.ciclos.filter(c => c.equipoId === equipoId && c.estado === 'ABIERTO');
    for (const c of ciclosA) {
      const eslabones = S.eslabones.filter(es => es.cicloId === c.id);
      const envio = eslabones.find(es => es.tipo === 'ENVIO');
      const recep = eslabones.find(es => es.tipo === 'RECEPCION');
      if (envio && !recep) return { ciclo: c, eslabon: envio };
    }
    return null;
  },
  asignacionDeEquipoMes(equipoId, anio, mes) {
    return S.asignaciones.find(a => a.equipoId === equipoId && a.anio === anio && a.mes === mes);
  }
};

async function registrarEvento({ equipoId, tipo, descripcion, responsable = 'Sistema', referencias = {}, payload = {} }) {
  const ev = {
    id: U.uuid(), equipoId,
    marcaTiempo: new Date().toISOString(),
    tipo, descripcion, responsable, referencias, payload
  };
  await DB.put('eventos', ev);
  S.eventos.push(ev);
  return ev;
}

const IMPORT = {
  CAMPOS_PROG: {
    numeroCarpeta:   ['n° carpeta','no carpeta','nro carpeta','carpeta','numero de carpeta','número de carpeta','n carpeta'],
    numeroInventario:['n° inventario','no inventario','inventario','inv','n inventario','numero de inventario','número de inventario'],
    numeroSerie:     ['n° serie','serie','nro serie','no serie','numero de serie','número de serie','n serie'],
    familia:         ['familia','tipo de equipo','tipo equipo'],
    servicio:        ['servicio','servicio clínico','servicio clinico'],
    unidad:          ['unidad'],
    ubicacion:       ['ubicación','ubicacion','ubicación física','ubicacion fisica'],
    marca:           ['marca'],
    modelo:          ['modelo'],
    anioAdq:         ['año adquisición','año adquisicion','ano adquisicion','año adq','anio adquisicion','anio adq'],
    anioInst:        ['año instalación','año instalacion','año inst','anio instalacion','anio inst'],
    procedencia:     ['procedencia'],
    vidaUtil:        ['vida útil','vida util','vida útil residual','vida utiil residual'],
    clasificacion:   ['clasificación','clasificacion','criticidad'],
    frecuencia:      ['frecuencia','periodicidad','frecuencia (meses)','frecuencia meses','periodicidad (meses)'],
    modalidad:       ['modalidad','modalidad mp','modalidad mantención','modalidad mantencion'],
    garantia:        ['garantía','garantia','en garantía','en garantia'],
    finGarantia:     ['fin garantía','fin garantia','fecha fin garantía','fecha fin garantia'],
    estado:          ['estado','estado operacional','estado equipo'],
    observaciones:   ['observaciones','obs']
  },
  MESES_PROG: {
    enero: 1, febrero: 2, marzo: 3, abril: 4, mayo: 5, junio: 6,
    julio: 7, agosto: 8, septiembre: 9, octubre: 10, noviembre: 11, diciembre: 12,
    ene: 1, feb: 2, mar: 3, abr: 4, may: 5, jun: 6, jul: 7, ago: 8, sep: 9, oct: 10, nov: 11, dic: 12
  },

  normCol(s) {
    return U.norm(s).toLowerCase()
      .replace(/°|º|\.|:/g, '')
      .replace(/\s+/g, ' ').trim();
  },

  resolverCol(headers, aliases) {
    const norm = headers.map(IMPORT.normCol);
    for (const a of aliases) {
      const idx = norm.indexOf(a);
      if (idx >= 0) return idx;
    }
    for (const a of aliases) {
      const idx = norm.findIndex(h => h && h.includes(a));
      if (idx >= 0) return idx;
    }
    return -1;
  },

  parsearWorkbook(workbook) {
    const sheetProg = workbook.Sheets[D.HOJA_PROG]
      || workbook.Sheets[Object.keys(workbook.Sheets).find(k => k.toLowerCase().includes('pmp'))]
      || workbook.Sheets[workbook.SheetNames[0]];
    const sheetReg  = workbook.Sheets[D.HOJA_REG]
      || workbook.Sheets[Object.keys(workbook.Sheets).find(k => k.toLowerCase().includes('registro'))];
    if (!sheetProg) throw new Error(`No se encontró la hoja "${D.HOJA_PROG}" en el archivo.`);

    const datosProg = XLSX.utils.sheet_to_json(sheetProg, { header: 1, defval: '', blankrows: false });
    const filasProg = IMPORT.estructurarProgramacion(datosProg);

    let filasReg = [];
    if (sheetReg) {
      const datosReg = XLSX.utils.sheet_to_json(sheetReg, { header: 1, defval: '', blankrows: false });
      filasReg = IMPORT.estructurarRegistro(datosReg);
    }
    return { filasProg, filasReg };
  },

  encontrarHeaderRow(rows, signos) {
    for (let i = 0; i < Math.min(15, rows.length); i++) {
      const norm = rows[i].map(IMPORT.normCol);
      const hits = signos.filter(s => norm.some(n => n.includes(s))).length;
      if (hits >= 3) return i;
    }
    return -1;
  },

  estructurarProgramacion(rows) {
    if (!rows || rows.length === 0) return [];
    const headerIdx = IMPORT.encontrarHeaderRow(rows, ['serie','familia','servicio','enero','marca']);
    if (headerIdx < 0) throw new Error('No se encontró la fila de encabezados en la hoja de programación.');
    const headers = rows[headerIdx];

    const idx = {};
    for (const [campo, aliases] of Object.entries(IMPORT.CAMPOS_PROG)) {
      idx[campo] = IMPORT.resolverCol(headers, aliases);
    }
    const idxMes = {};
    for (let i = 0; i < headers.length; i++) {
      const n = IMPORT.normCol(headers[i]);
      if (IMPORT.MESES_PROG[n] !== undefined) idxMes[IMPORT.MESES_PROG[n]] = i;
    }

    const filas = [];
    for (let r = headerIdx + 1; r < rows.length; r++) {
      const row = rows[r];
      if (!row || row.every(c => U.isBlank(c))) continue;

      const fila = {
        numeroCarpeta:   IMPORT.cell(row, idx.numeroCarpeta),
        numeroInventario:IMPORT.cell(row, idx.numeroInventario),
        numeroSerie:     IMPORT.cell(row, idx.numeroSerie),
        familia:         IMPORT.normalizarFamilia(IMPORT.cell(row, idx.familia)),
        servicio:        IMPORT.cell(row, idx.servicio),
        unidad:          IMPORT.cell(row, idx.unidad),
        ubicacion:       IMPORT.cell(row, idx.ubicacion),
        marca:           IMPORT.cell(row, idx.marca),
        modelo:          IMPORT.cell(row, idx.modelo),
        anioAdq:         IMPORT.cellInt(row, idx.anioAdq),
        anioInst:        IMPORT.cellInt(row, idx.anioInst),
        procedencia:     IMPORT.cell(row, idx.procedencia),
        vidaUtil:        IMPORT.cellInt(row, idx.vidaUtil),
        clasificacion:   IMPORT.cell(row, idx.clasificacion).toUpperCase().startsWith('B') ? 'B' : 'A',
        frecuencia:      IMPORT.cellInt(row, idx.frecuencia),
        modalidad:       IMPORT.normalizarModalidad(IMPORT.cell(row, idx.modalidad)),
        garantia:        IMPORT.parseBool(IMPORT.cell(row, idx.garantia)),
        finGarantia:     IMPORT.parseFecha(IMPORT.cell(row, idx.finGarantia)),
        estado:          IMPORT.normalizarEstado(IMPORT.cell(row, idx.estado)),
        observaciones:   IMPORT.cell(row, idx.observaciones),
        meses: {}
      };
      for (const [mes, c] of Object.entries(idxMes)) {
        const v = U.normUpper(row[c]);
        fila.meses[mes] = IMPORT.normalizarCodigoGrilla(v);
      }
      if (!fila.frecuencia && fila.familia) fila.frecuencia = D.PERIODICIDAD_FAMILIA[fila.familia];
      filas.push(fila);
    }
    return filas;
  },

  estructurarRegistro(rows) {
    if (!rows || rows.length === 0) return [];
    const headerIdx = IMPORT.encontrarHeaderRow(rows, ['serie','familia','enero']);
    if (headerIdx < 0) return [];
    const headers = rows[headerIdx];
    const idxSerie = IMPORT.resolverCol(headers, IMPORT.CAMPOS_PROG.numeroSerie);
    const idxMes = {};
    for (let i = 0; i < headers.length; i++) {
      const n = IMPORT.normCol(headers[i]);
      if (IMPORT.MESES_PROG[n] !== undefined) idxMes[IMPORT.MESES_PROG[n]] = i;
    }
    const filas = [];
    for (let r = headerIdx + 1; r < rows.length; r++) {
      const row = rows[r];
      if (!row || row.every(c => U.isBlank(c))) continue;
      const serie = IMPORT.cell(row, idxSerie);
      if (U.isBlank(serie) || U.esValorDisponible(serie)) continue;
      const meses = {};
      for (const [mes, c] of Object.entries(idxMes)) {
        const v = U.normUpper(row[c]);
        if (v && !['X','R','RA','PM','VACIO',''].includes(v)) meses[mes] = v;
      }
      if (Object.keys(meses).length > 0) filas.push({ serie, meses });
    }
    return filas;
  },

  cell(row, idx) { if (idx < 0) return ''; return U.norm(row[idx]); },
  cellInt(row, idx) {
    if (idx < 0) return null;
    const v = parseInt(row[idx]);
    return isNaN(v) ? null : v;
  },
  parseBool(s) {
    const u = U.normUpper(s);
    return u === 'SI' || u === 'SÍ' || u === 'TRUE' || u === '1' || u === 'X';
  },
  parseFecha(s) {
    if (!s) return null;
    if (s instanceof Date) return U.formatISO(s);
    const m = String(s).match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
    if (m) {
      const [_, d, mo, y] = m;
      const yy = y.length === 2 ? 2000 + parseInt(y) : parseInt(y);
      return U.formatISO(new Date(yy, parseInt(mo) - 1, parseInt(d)));
    }
    return null;
  },

  normalizarFamilia(s) {
    const u = U.normUpper(s).replace(/[ÁÀÄ]/g,'A').replace(/[ÉÈË]/g,'E').replace(/[ÍÌÏ]/g,'I').replace(/[ÓÒÖ]/g,'O').replace(/[ÚÙÜ]/g,'U');
    if (u.includes('MONITOR')) return 'MONITORIZACION';
    if (u.includes('DESFIB')) return 'DESFIBRILADOR';
    if (u === 'DEA') return 'DEA';
    if (u.includes('VENTI')) return 'VENTILADOR';
    if (u.includes('ANES')) return 'ANESTESIA';
    if (u.includes('INCUB')) return 'INCUBADORA';
    if (u.includes('DIAL')) return 'DIALISIS';
    for (const f of D.FAMILIAS) if (u === f) return f;
    return u || 'MONITORIZACION';
  },
  normalizarModalidad(s) { return U.normUpper(s).startsWith('EXT') ? 'EXTERNA' : 'INTERNA'; },
  normalizarEstado(s) {
    const u = U.normUpper(s);
    if (u.includes('BAJA')) return 'DE_BAJA';
    if (u.includes('FUERA')) return 'FUERA_DE_SERVICIO';
    if (u.includes('SERVICIO TEC') || u === 'ST') return 'SERVICIO_TECNICO';
    if (u.includes('NO OP') || u === 'NO_OPERATIVO') return 'NO_OPERATIVO';
    return 'OPERATIVO';
  },
  normalizarCodigoGrilla(v) {
    const u = U.normUpper(v);
    if (D.CODIGOS_GRILLA.includes(u)) return u;
    if (u === '' || u === '-') return 'VACIO';
    return u;
  },

  async cargarInicial(filasProg, filasReg) {
    const equipos = [], celdas = [], mantenciones = [];
    for (const fila of filasProg) {
      const eq = D.equipoDesdeFilaMaestro(fila);
      equipos.push(eq);
      for (let mes = 1; mes <= 12; mes++) celdas.push(D.celdaMaestroDesdeFila(eq.id, mes, fila));
    }
    // Historial
    for (const filaReg of filasReg) {
      const eq = equipos.find(e => U.normUpper(e.numeroSerie) === U.normUpper(filaReg.serie));
      if (!eq) continue;
      for (const [mes, codigo] of Object.entries(filaReg.meses)) {
        if (['SI'].includes(codigo) || D.CAUSALES[codigo] || ['FS','BAJA'].includes(codigo)) {
          const fechaISO = U.formatISO(U.ultimoDiaMes(D.ANIO_VIGENTE, parseInt(mes)));
          mantenciones.push({
            id: U.uuid(), equipoId: eq.id,
            fechaRealEjecucion: fechaISO,
            resultado: codigo,
            ejecutor: 'histórico sin ejecutor identificable',
            motivoCambioEjecutor: null,
            observacionesTecnico: '',
            estadoFinalEquipo: codigo === 'SI' ? 'OPERATIVO' : 'NO_OPERATIVO',
            origen: 'importado',
            eliminado: false, logEdiciones: [],
            creadoEn: new Date().toISOString()
          });
        }
      }
    }

    await DB.putMany('equipos', equipos);
    await DB.putMany('celdasGrilla', celdas);
    await DB.putMany('mantenciones', mantenciones);

    const existentes = await DB.all('tecnicos');
    if (existentes.length === 0) {
      const tecs = D.TECNICOS_INICIAL.map(n => ({ id: U.uuid(), nombreCanonico: n, activo: true }));
      await DB.putMany('tecnicos', tecs);
    }

    await DB.put('configuracion', {
      clave: 'ultimaCargaMaestro',
      valor: { fecha: new Date().toISOString(), filasProg: filasProg.length, filasReg: filasReg.length }
    });

    await S.hidratar();
    await registrarEvento({
      equipoId: null, tipo: 'APLICACION_CAMBIOS_MAESTRO',
      descripcion: `Carga inicial: ${equipos.length} equipos, ${mantenciones.length} MP históricas.`,
      payload: { filasProg: filasProg.length, filasReg: filasReg.length }
    });

    return { equipos: equipos.length, mantenciones: mantenciones.length };
  },

  // ──── Detección de inconsistencias / diff ────
  detectarDiferencias(filasProg, filasReg) {
    const diff = {
      equiposAusentes: [],
      equiposNuevos: [],
      cambiosGrilla: [],
      cambiosDatos: [],
      inconsistenciasGrilla: [],   // operador registró X, maestro nuevo dice Y (no eran sistema)
      inconsistenciasReg: []        // MP registrada por operador difiere de registro histórico del maestro nuevo
    };
    const seriesEnMaestro = new Set(
      filasProg.filter(f => !D.esSlot(f)).map(f => U.normUpper(f.numeroSerie))
    );
    for (const e of S.equipos) {
      if (e.esSlot) continue;
      if (!seriesEnMaestro.has(U.normUpper(e.numeroSerie))) diff.equiposAusentes.push(e);
    }
    for (const fila of filasProg) {
      if (D.esSlot(fila)) continue;
      const existente = S.equipoPorSerie(fila.numeroSerie);
      if (!existente) {
        diff.equiposNuevos.push(fila);
        continue;
      }
      const campos = {
        servicioClinico: 'servicio',
        unidad: 'unidad',
        ubicacionFisica: 'ubicacion',
        marca: 'marca',
        modelo: 'modelo',
        frecuenciaMeses: 'frecuencia'
      };
      const cambios = {};
      for (const [campoEq, campoFila] of Object.entries(campos)) {
        if (U.norm(existente[campoEq]) !== U.norm(fila[campoFila])) {
          cambios[campoEq] = { antes: existente[campoEq], despues: fila[campoFila] };
        }
      }
      if (Object.keys(cambios).length > 0) diff.cambiosDatos.push({ equipo: existente, cambios });

      // Comparar grilla
      const celdasActuales = S.celdasDeEquipo(existente.id);
      for (let mes = 1; mes <= 12; mes++) {
        const codAct = celdasActuales[mes - 1].codigo;
        const codNuevo = fila.meses[mes] || 'VACIO';
        const origenAct = celdasActuales[mes - 1].origen;
        if (codAct !== codNuevo) {
          if (origenAct === 'sistema') {
            // No se sobrescribe pero podría ser inconsistencia (operador registró distinto a maestro)
            // Solo es inconsistencia si el maestro nuevo trae código operativo y nosotros tenemos otro operativo
            if (D.esCodigoOperativo(codAct) && D.esCodigoOperativo(codNuevo) && codAct !== codNuevo) {
              diff.inconsistenciasGrilla.push({ equipo: existente, mes, registrado: codAct, maestroNuevo: codNuevo });
            }
          } else {
            diff.cambiosGrilla.push({ equipo: existente, mes, antes: codAct, despues: codNuevo });
          }
        }
      }
    }

    // Comparar histórico (Registro_MP-2026) vs lo registrado por el operador
    for (const filaReg of (filasReg || [])) {
      const eq = S.equipoPorSerie(filaReg.serie);
      if (!eq) continue;
      for (const [mesStr, codigoMaestro] of Object.entries(filaReg.meses)) {
        const mes = parseInt(mesStr);
        const mpDelMes = S.mantenciones.find(m =>
          !m.eliminado && m.equipoId === eq.id &&
          U.parseISO(m.fechaRealEjecucion).getMonth() + 1 === mes &&
          U.parseISO(m.fechaRealEjecucion).getFullYear() === D.ANIO_VIGENTE);
        if (mpDelMes && mpDelMes.resultado !== codigoMaestro && mpDelMes.origen !== 'importado') {
          diff.inconsistenciasReg.push({
            equipo: eq, mes,
            registrado: mpDelMes.resultado,
            maestroNuevo: codigoMaestro,
            mpId: mpDelMes.id
          });
        }
      }
    }

    return diff;
  },

  async aplicarDiff(diff, filasProg) {
    const ops = [];
    for (const fila of diff.equiposNuevos) {
      const eq = D.equipoDesdeFilaMaestro(fila);
      ops.push({ store: 'equipos', tipo: 'put', obj: eq });
      for (let mes = 1; mes <= 12; mes++) {
        ops.push({ store: 'celdasGrilla', tipo: 'put', obj: D.celdaMaestroDesdeFila(eq.id, mes, fila) });
      }
    }
    for (const c of diff.cambiosDatos) {
      const eq = { ...c.equipo };
      for (const [campo, val] of Object.entries(c.cambios)) eq[campo] = val.despues;
      eq.actualizadoEn = new Date().toISOString();
      ops.push({ store: 'equipos', tipo: 'put', obj: eq });
    }
    for (const c of diff.cambiosGrilla) {
      const celdaActual = S.celdas.find(x => x.equipoId === c.equipo.id && x.anio === D.ANIO_VIGENTE && x.mes === c.mes);
      if (celdaActual) {
        ops.push({ store: 'celdasGrilla', tipo: 'put', obj: { ...celdaActual, codigo: c.despues, origen: 'maestro' } });
      }
    }
    if (ops.length > 0) await DB.batchWrite(ops);

    // Inconsistencias generan pendientes para revisión manual
    for (const inc of [...diff.inconsistenciasGrilla, ...diff.inconsistenciasReg]) {
      const p = {
        id: U.uuid(), tipo: 'INCONSISTENCIA',
        equipoId: inc.equipo.id,
        titulo: `Inconsistencia en ${U.nombreMes(inc.mes)}`,
        descripcion: `Lo registrado en el sistema dice "${inc.registrado}" pero el maestro nuevo dice "${inc.maestroNuevo}" para el mes de ${U.nombreMes(inc.mes)}. Revisar y decidir cuál es la versión correcta.`,
        responsable: 'Operador',
        fechaCreacion: U.hoyISO(),
        fechaCompromiso: null,
        estado: 'ABIERTO',
        origen: 'AUTO_INCONSISTENCIA',
        subtareas: [
          { id: U.uuid(), texto: `Revisar registro de ${U.nombreMes(inc.mes)} en el sistema`, hecha: false },
          { id: U.uuid(), texto: 'Consultar con quien hizo el registro', hecha: false },
          { id: U.uuid(), texto: 'Actualizar maestro o sistema según corresponda', hecha: false }
        ],
        log: [{ fecha: new Date().toISOString(), autor: 'Sistema', accion: 'creado', nota: 'Generado al detectar diferencia entre sistema y maestro nuevo.' }],
        meta: { mes: inc.mes, registrado: inc.registrado, maestroNuevo: inc.maestroNuevo }
      };
      await DB.put('pendientes', p);
      S.pendientes.push(p);
      await registrarEvento({
        equipoId: inc.equipo.id, tipo: 'INCONSISTENCIA_DETECTADA',
        descripcion: p.descripcion, responsable: 'Sistema'
      });
    }

    await DB.put('configuracion', {
      clave: 'ultimaCargaMaestro',
      valor: { fecha: new Date().toISOString(), filasProg: filasProg.length }
    });

    await S.hidratar();
    await registrarEvento({
      equipoId: null, tipo: 'APLICACION_CAMBIOS_MAESTRO',
      descripcion: `Reaplicación maestro: ${diff.equiposNuevos.length} nuevos · ${diff.cambiosDatos.length} datos · ${diff.cambiosGrilla.length} grilla · ${diff.inconsistenciasGrilla.length + diff.inconsistenciasReg.length} inconsistencias detectadas`,
      payload: { ausentes: diff.equiposAusentes.map(e => e.id) }
    });
  }
};

// 5. GENERADORES (ExcelJS para data validation real)
// ═══════════════════════════════════════════════════════════════
const GEN = {
  async generarPlanillaAsignacion(anio, mes) {
    const equipos = S.equipos.filter(e => !e.esSlot && e.estadoOperacional !== 'DE_BAJA');
    const elegibles = equipos.filter(e => {
      const c = S.celdasDeEquipo(e.id, anio)[mes - 1];
      return ['X','R','RA','PM'].includes(c.codigo);
    }).sort((a, b) => (a.servicioClinico || '').localeCompare(b.servicioClinico || ''));

    const tecs = S.tecnicos.filter(t => t.activo).map(t => t.nombreCanonico);

    const wb = new ExcelJS.Workbook();
    wb.creator = 'PMP HHHA';
    wb.created = new Date();

    // Hoja oculta con técnicos (referencia para validación)
    const tecsSheet = wb.addWorksheet('Tecnicos');
    tecsSheet.state = 'hidden';
    tecsSheet.getCell('A1').value = 'Tecnicos';
    tecsSheet.getCell('A1').font = { bold: true };
    tecs.forEach((t, i) => {
      tecsSheet.getCell(`A${i + 2}`).value = t;
    });
    // Definir un Named Range para uso en la validación
    wb.definedNames.add(`Tecnicos!$A$2:$A$${tecs.length + 1}`, 'TecnicosList');

    // Hoja principal
    const ws = wb.addWorksheet(`Asignacion_${U.nombreMesCorto(mes)}_${anio}`);
    ws.columns = [
      { header: 'N° Carpeta',     key: 'carpeta',  width: 12 },
      { header: 'N° Inventario',  key: 'inv',      width: 14 },
      { header: 'N° Serie',       key: 'serie',    width: 16 },
      { header: 'Familia',        key: 'familia',  width: 16 },
      { header: 'Marca',          key: 'marca',    width: 16 },
      { header: 'Modelo',         key: 'modelo',   width: 16 },
      { header: 'Año adq.',       key: 'anio',     width: 8 },
      { header: 'Servicio',       key: 'servicio', width: 24 },
      { header: 'Unidad',         key: 'unidad',   width: 18 },
      { header: 'Ubicación',      key: 'ubic',     width: 20 },
      { header: 'Tipo MP',        key: 'tipo',     width: 12 },
      { header: 'Responsable',    key: 'resp',     width: 32 }
    ];
    // Estilo encabezado
    ws.getRow(1).font = { bold: true, color: { argb: 'FFFFFFFF' } };
    ws.getRow(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF14110D' } };
    ws.getRow(1).alignment = { vertical: 'middle', horizontal: 'left' };
    ws.getRow(1).height = 22;

    for (const e of elegibles) {
      const c = S.celdasDeEquipo(e.id, anio)[mes - 1];
      const tipo = c.codigo === 'PM' ? 'PM' : (c.codigo === 'R' || c.codigo === 'RA' ? 'REPROGRAMADA' : 'PROGRAMADA');
      const existente = S.asignaciones.find(a => a.equipoId === e.id && a.anio === anio && a.mes === mes);
      ws.addRow({
        carpeta: e.numeroCarpeta || '',
        inv: e.numeroInventario || '',
        serie: e.numeroSerie || '',
        familia: e.familia,
        marca: e.marca || '',
        modelo: e.modelo || '',
        anio: e.anioAdquisicion || '',
        servicio: e.servicioClinico || '',
        unidad: e.unidad || '',
        ubic: e.ubicacionFisica || '',
        tipo,
        resp: existente ? existente.responsable : ''
      });
    }

    // Aplicar data validation (lista) a la columna L (Responsable) desde la fila 2 en adelante
    const ultimaFila = Math.max(elegibles.length + 1, 200);
    for (let r = 2; r <= ultimaFila; r++) {
      ws.getCell(`L${r}`).dataValidation = {
        type: 'list',
        allowBlank: true,
        formulae: ['TecnicosList'],
        showErrorMessage: true,
        errorTitle: 'Responsable no válido',
        error: 'Selecciona un técnico de la lista. Debe coincidir exactamente con un técnico oficial registrado en el sistema.',
        promptTitle: 'Seleccionar técnico',
        prompt: 'Elige el técnico responsable de la lista desplegable.'
      };
    }
    // Bordes ligeros y zebra
    for (let r = 2; r <= elegibles.length + 1; r++) {
      const row = ws.getRow(r);
      if (r % 2 === 0) row.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFAF7F1' } };
      row.alignment = { vertical: 'middle' };
      ws.getCell(`L${r}`).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFFF9E6' } };
      ws.getCell(`L${r}`).border = { left: { style: 'thin', color: { argb: 'FFB4791E' } } };
    }
    ws.views = [{ state: 'frozen', xSplit: 0, ySplit: 1 }];

    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    U.download(blob, `asignacion_${U.nombreMesCorto(mes)}_${anio}.xlsx`);
    return elegibles.length;
  },

  async generarInformeXlsx(informe) {
    const wb = new ExcelJS.Workbook();
    const ws = wb.addWorksheet('Informe');
    ws.mergeCells('A1:F1');
    ws.getCell('A1').value = `INFORME MENSUAL — ${informe.cabecera.servicioClinico}`;
    ws.getCell('A1').font = { size: 16, bold: true };
    ws.mergeCells('A2:F2');
    ws.getCell('A2').value = `${U.nombreMes(informe.cabecera.mes)} ${informe.cabecera.anio}`;
    ws.getCell('A2').font = { italic: true, color: { argb: 'FF666666' } };

    let row = 4;
    const stat = (lbl, val) => {
      ws.getCell(`A${row}`).value = lbl;
      ws.getCell(`A${row}`).font = { bold: true };
      ws.getCell(`B${row}`).value = val;
      row++;
    };
    stat('Total equipos', informe.resumen.totalEquipos);
    stat('Programadas', informe.resumen.programadas);
    stat('Ejecutadas', informe.resumen.ejecutadas);
    stat('Cumplimiento', `${informe.resumen.porcentaje}%`);
    stat('No operativos', informe.resumen.noOperativos);
    row++;

    if (Object.keys(informe.resumen.causales).length > 0) {
      ws.getCell(`A${row}`).value = 'Causales del mes';
      ws.getCell(`A${row}`).font = { bold: true };
      row++;
      for (const [c, n] of Object.entries(informe.resumen.causales)) {
        ws.getCell(`A${row}`).value = `${c} (×${n})`;
        ws.getCell(`B${row}`).value = D.CAUSALES[c].texto;
        row++;
      }
      row++;
    }

    ws.getCell(`A${row}`).value = 'Detalle de equipos del mes';
    ws.getCell(`A${row}`).font = { bold: true };
    row++;
    const headerRow = row;
    ws.getCell(`A${row}`).value = 'N° Inventario';
    ws.getCell(`B${row}`).value = 'Serie';
    ws.getCell(`C${row}`).value = 'Marca/Modelo';
    ws.getCell(`D${row}`).value = 'Resultado';
    ws.getCell(`E${row}`).value = 'Ejecutor';
    ws.getCell(`F${row}`).value = 'Observaciones';
    ws.getRow(row).font = { bold: true };
    ws.getRow(row).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFEEEEEE' } };
    row++;
    for (const det of informe.detalleEquipos) {
      ws.getCell(`A${row}`).value = det.identificacion.inv;
      ws.getCell(`B${row}`).value = det.identificacion.serie;
      ws.getCell(`C${row}`).value = det.identificacion.marcaModelo;
      ws.getCell(`D${row}`).value = det.resultado;
      ws.getCell(`E${row}`).value = det.ejecutor;
      ws.getCell(`F${row}`).value = det.observaciones;
      row++;
    }
    ws.columns = [
      { width: 16 },{ width: 18 },{ width: 24 },{ width: 12 },{ width: 24 },{ width: 60 }
    ];

    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const nombre = informe.cabecera.servicioClinico.replace(/[^\w]+/g, '_');
    U.download(blob, `informe_${nombre}_${U.nombreMesCorto(informe.cabecera.mes)}_${informe.cabecera.anio}.xlsx`);
  }
};
