// 6. GRABADOR DE SESIÓN
// ═══════════════════════════════════════════════════════════════
const REC = {
  activo: false,
  log: [],
  inicio: null,
  timerInterval: null,

  start() {
    if (REC.activo) return;
    REC.activo = true;
    REC.log = [];
    REC.inicio = Date.now();
    REC.log.push({
      t: 0,
      tipo: 'inicio',
      datos: {
        userAgent: navigator.userAgent,
        viewport: { w: innerWidth, h: innerHeight },
        ruta: UI.ruta,
        cantidadEquipos: S.equipos.length
      }
    });
    document.getElementById('rec-btn').classList.add('is-recording');
    document.getElementById('rec-label').textContent = 'Detener';
    document.getElementById('rec-floater').classList.add('is-on');
    REC.attachListeners();
    REC.timerInterval = setInterval(() => {
      const s = Math.floor((Date.now() - REC.inicio) / 1000);
      document.getElementById('rec-timer').textContent =
        `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
      document.getElementById('rec-count').textContent = String(REC.log.length);
    }, 500);
    U.toast('Grabación iniciada', 'ok');
  },

  async stop() {
    if (!REC.activo) return;
    REC.activo = false;
    clearInterval(REC.timerInterval);
    REC.detachListeners();
    REC.entry('fin', { duracionSegundos: Math.floor((Date.now() - REC.inicio) / 1000) });

    document.getElementById('rec-btn').classList.remove('is-recording');
    document.getElementById('rec-label').textContent = 'Grabar';
    document.getElementById('rec-floater').classList.remove('is-on');

    // Snapshot completo de la base
    const snapshot = {
      equipos: S.equipos,
      celdasGrilla: S.celdas,
      mantenciones: S.mantenciones,
      ciclos: S.ciclos,
      eslabones: S.eslabones,
      pendientes: S.pendientes,
      asignaciones: S.asignaciones,
      contactos: S.contactos,
      eventos: S.eventos,
      tecnicos: S.tecnicos,
      configuracion: Object.entries(S.config).map(([clave, valor]) => ({ clave, valor }))
    };

    const sesion = {
      version: 1,
      generadoEn: new Date().toISOString(),
      inicio: new Date(REC.inicio).toISOString(),
      duracionSegundos: Math.floor((Date.now() - REC.inicio) / 1000),
      cantidadEventos: REC.log.length,
      eventos: REC.log,
      snapshotBaseDatos: snapshot,
      metadatos: {
        userAgent: navigator.userAgent,
        viewport: { w: innerWidth, h: innerHeight },
        url: location.href
      }
    };
    const fechaArch = U.formatISO(new Date()).replace(/-/g,'') + '-' + new Date().toTimeString().slice(0,5).replace(':','');
    U.downloadJSON(sesion, `pmp-grabacion-${fechaArch}.json`);
    U.toast('Grabación guardada (' + REC.log.length + ' eventos)', 'ok');
  },

  entry(tipo, datos = {}) {
    if (!REC.activo) return;
    REC.log.push({
      t: Date.now() - REC.inicio,
      tipo,
      datos
    });
  },

  _handlers: {},

  attachListeners() {
    REC._handlers.click = (e) => {
      const target = e.target.closest('button, .nav-item, .grilla-cell, .radio-pill, .causal-option, .tab, [role="button"], a, tr.is-clickable') || e.target;
      const desc = REC.describeTarget(target);
      REC.entry('click', desc);
    };
    REC._handlers.input = (e) => {
      // Solo registrar el value final cuando el usuario sale del input, no cada tecla
      const t = e.target;
      if (!(t.matches('input, textarea, select'))) return;
      REC.entry('input', {
        id: t.id || t.name || '',
        tag: t.tagName.toLowerCase(),
        tipo: t.type || '',
        valor: t.value ? t.value.slice(0, 200) : '',
        placeholder: t.placeholder || '',
        cerca: REC.contextoTexto(t)
      });
    };
    REC._handlers.search = (e) => {
      if (e.target.classList && e.target.classList.contains('search-input')) {
        REC.entry('busqueda', { valor: e.target.value });
      }
    };
    document.addEventListener('click', REC._handlers.click, true);
    document.addEventListener('change', REC._handlers.input, true);
    document.addEventListener('input', REC._handlers.search, true);
  },

  detachListeners() {
    document.removeEventListener('click', REC._handlers.click, true);
    document.removeEventListener('change', REC._handlers.input, true);
    document.removeEventListener('input', REC._handlers.search, true);
  },

  describeTarget(el) {
    if (!el) return { tag: '?' };
    const tag = el.tagName ? el.tagName.toLowerCase() : '?';
    return {
      tag,
      texto: (el.textContent || '').slice(0, 80).trim(),
      id: el.id || '',
      class: el.className && typeof el.className === 'string' ? el.className.slice(0, 80) : '',
      title: el.getAttribute && el.getAttribute('title') || ''
    };
  },

  contextoTexto(el) {
    let parent = el.closest('.field, .panel-body, .modal-body');
    if (!parent) return '';
    const labelEl = parent.querySelector('.label');
    return labelEl ? labelEl.textContent.trim() : '';
  },

  // Wrappers explícitos
  navegacion(ruta, param) { REC.entry('navegacion', { ruta, param: param ? String(param).slice(0,40) : null }); },
  modalAbierto(titulo) { REC.entry('modal_abierto', { titulo }); },
  modalCerrado(titulo) { REC.entry('modal_cerrado', { titulo }); },
  accionDB(accion, descripcion) { REC.entry('accion_db', { accion, descripcion }); }
};

      con: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
      tec: '<path d="M14.7 6.3a4 4 0 1 1-1.4 1.4l-7 7 3 3 7-7M3 14l4 4-2 2H3v-2l4-4"/>',
      mae: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
      res: '<path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7M17 8l-5-5-5 5M12 3v15"/>'
    };
    svg.innerHTML = paths[name] || '<circle cx="12" cy="12" r="9"/>';
    return svg;
  },

  modal({ titulo, contenido, footer, ancho = 'normal', onClose = null }) {
    const root = document.getElementById('modal-root');
    const backdrop = U.el('div', { class: 'modal-backdrop' });
    const modal = U.el('div', { class: 'modal' + (ancho === 'large' ? ' modal-large' : ancho === 'xlarge' ? ' modal-xlarge' : '') });
    const head = U.el('div', { class: 'modal-head' }, [
      U.el('h3', { class: 'modal-title' }, titulo),
      U.el('button', { class: 'modal-close', onclick: () => cerrar(), html: '×' })
    ]);
    const body = U.el('div', { class: 'modal-body' });
    if (contenido) body.appendChild(contenido);
    const foot = footer ? U.el('div', { class: 'modal-foot' }, footer) : null;
    modal.appendChild(head); modal.appendChild(body);
    if (foot) modal.appendChild(foot);
    backdrop.appendChild(modal);
    root.appendChild(backdrop);
    if (typeof REC !== 'undefined') REC.modalAbierto(titulo);
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) cerrar(); });
    function cerrar() {
      root.removeChild(backdrop);
      if (typeof REC !== 'undefined') REC.modalCerrado(titulo);
      if (onClose) onClose();
    }
    return { cerrar, body, modal };
  },

  badgeEstado(estado) {
    const map = {
      OPERATIVO: { cls: 'badge-ok',     txt: 'Operativo' },
      NO_OPERATIVO: { cls: 'badge-accent', txt: 'No operativo' },
      SERVICIO_TECNICO: { cls: 'badge-warn',   txt: 'Servicio técnico' },
      FUERA_DE_SERVICIO: { cls: 'badge-muted', txt: 'Fuera de servicio' },
      DE_BAJA: { cls: 'badge-muted', txt: 'De baja' }
    };
    const x = map[estado] || { cls: 'badge-muted', txt: estado };
    return U.el('span', { class: 'badge ' + x.cls + ' badge-dot' }, x.txt);
  },

  // Resuelve la clase CSS y la etiqueta corta para un código de grilla (X/R/RA/PM/SI/Cn/FS/BAJA).
  // Centraliza la triple condicional `c.codigo === 'PM' ? badge-warn : ...` que aparecía en
  // varias vistas (ficha equipo, plantilla mensual, informe por servicio).
  badgeCodigoGrilla(codigo) {
    if (codigo === 'PM')                return { cls: 'badge-warn',   txt: 'PM' };
    if (codigo === 'R' || codigo === 'RA') return { cls: 'badge-cool', txt: codigo === 'RA' ? 'RA' : 'R' };
    if (codigo === 'X')                 return { cls: 'badge-muted',  txt: 'X' };
    if (codigo === 'SI')                return { cls: 'badge-ok',     txt: 'SI' };
    if (codigo === 'FS')                return { cls: 'badge-warn',   txt: 'FS' };
    if (codigo === 'BAJA')              return { cls: 'badge-muted',  txt: 'BAJA' };
    if (D.CAUSALES[codigo])             return { cls: 'badge-accent', txt: codigo };
    return { cls: 'badge-muted', txt: codigo || '—' };
  },

  /**
   * Construye un <select> de responsables (técnicos activos del SEC) con opciones
   * extra opcionales (típicamente supervisora del servicio), y una opción final
   * "Otro…" que muestra un input de texto libre para casos puntuales.
   * Devuelve un wrapper <div> que expone .getValue() para leer el responsable elegido.
   *
   * @param {object} opts
   * @param {string} opts.id           — id base usado en select + input "otro"
   * @param {string} [opts.value]      — valor preseleccionado
   * @param {string[]} [opts.extras]   — opciones extra a anteponer (ej: supervisora)
   * @param {boolean} [opts.permitirOtro=true] — incluir opción "Otro…"
   */
  selectResponsable(opts = {}) {
    const id = opts.id || 'resp-' + Math.random().toString(36).slice(2, 7);
    const value = opts.value || '';
    const extras = (opts.extras || []).filter(Boolean);
    const permitirOtro = opts.permitirOtro !== false;
    const tecnicos = S.tecnicos.filter(t => t.activo).map(t => t.nombreCanonico);
    // Una sola lista, con extras primero, dedupe-ando el supervisor si coincide con un técnico
    const opcionesUnicas = U.unique([...extras, ...tecnicos]).filter(Boolean);

    const wrap = U.el('div', { class: 'select-responsable' });
    const select = U.el('select', { class: 'select select-full', id });
    select.appendChild(U.el('option', { value: '' }, '— Selecciona responsable —'));
    for (const n of opcionesUnicas) {
      const o = U.el('option', { value: n }, n);
      if (n === value) o.setAttribute('selected', '');
      select.appendChild(o);
    }
    if (permitirOtro) select.appendChild(U.el('option', { value: '__OTRO__' }, 'Otro… (escribir)'));

    // Si el valor inicial no está en la lista, lo dejamos en "Otro…" con el texto cargado
    const otroInput = U.el('input', {
      class: 'input', id: id + '-otro', placeholder: 'Escribir responsable',
      style: { display: 'none', marginTop: '6px' }
    });
    if (value && !opcionesUnicas.includes(value) && permitirOtro) {
      select.value = '__OTRO__';
      otroInput.value = value;
      otroInput.style.display = '';
    }
    select.addEventListener('change', () => {
      otroInput.style.display = (select.value === '__OTRO__') ? '' : 'none';
      if (select.value === '__OTRO__') otroInput.focus();
    });

    wrap.appendChild(select);
    wrap.appendChild(otroInput);
    wrap.getValue = () => {
      const v = select.value;
      if (v === '__OTRO__') return otroInput.value.trim();
      return v;
    };
    return wrap;
  }
};

          ev.stopPropagation();
          if (e.id && navigator.clipboard) {

            );

        U.el('div', { class: 'text-mono text-xs text-muted' }, 'INV ' + (U.norm(e.numeroInventario) !== '' ? e.numeroInventario : '—'))
      ]));
      tr.appendChild(U.el('td', { class: 'text-mono text-xs' }, e.familia));

        U.el('div', { class: 'text-xs text-muted' }, e.unidad || '')
      ]));
      tr.appendChild(U.el('td', {}, [
        U.el('div', { class: 'text-strong' }, e.marca || '—'),

      }

    const info = U.el('div', { class: 'flex-between', style: { padding: '10px 12px', borderTop: '1px solid var(--line-soft)', fontSize: '12px', color: 'var(--ink-3)' } });
    info.appendChild(U.el('span', {}, `Mostrando ${filtrados.length} de ${S.equipos.length}`));
    const slots = filtrados.filter(e => e.esSlot).length;
    info.appendChild(U.el('span', { class: 'text-mono' }, `${filtrados.length - slots} activos · ${slots} slots`));
    tablaWrap.appendChild(info);
  }
  renderTabla();
  return wrap;
};

function filtrarEquipos(f) {
  let r = [...S.equipos];
  if (!f.incluirSlots) r = r.filter(e => !e.esSlot);
  if (!f.incluirBajas) r = r.filter(e => e.estadoOperacional !== 'DE_BAJA');
  if (f.query) {
    const q = f.query.toLowerCase().trim();
    r = r.filter(e =>
      (e.id || '').toLowerCase().includes(q) ||
      (e.numeroSerie || '').toLowerCase().includes(q) ||
      (String(e.numeroInventario ?? '')).toLowerCase().includes(q) ||
      (e.numeroCarpeta || '').toLowerCase().includes(q) ||
      (e.marca || '').toLowerCase().includes(q) ||
      (e.modelo || '').toLowerCase().includes(q));
  }
  if (f.familia) r = r.filter(e => e.familia === f.familia);
  if (f.servicio) r = r.filter(e => e.servicioClinico === f.servicio);
  if (f.estado) r = r.filter(e => e.estadoOperacional === f.estado);
  if (f.soloAlerta) r = r.filter(e => D.chequearAlerta30Dias(e, S.mantenciones, S.ciclos));
  r.sort((a, b) => {
    if (a.esSlot !== b.esSlot) return a.esSlot ? 1 : -1;
    return (a.servicioClinico || '').localeCompare(b.servicioClinico || '');
  });
  return r;
}

  ]));
  const grillaBody = U.el('div', { class: 'panel-body' });
  const grilla = U.el('div', { class: 'grilla' });
  const celdas = S.celdasDeEquipo(e.id);
  for (let m = 1; m <= 12; m++) {
    const cell = celdas[m - 1];
    const cellEl = U.el('div', {
      class: `grilla-cell cod-${cell.codigo === 'VACIO' ? 'VACIO' : cell.codigo}`,
      onclick: () => marcarGrilla(e, m, cell)
    });
    cellEl.appendChild(U.el('div', { class: 'grilla-mes' }, U.nombreMesCorto(m)));
    cellEl.appendChild(U.el('div', { class: 'grilla-cod' }, cell.codigo === 'VACIO' ? '—' : cell.codigo));
    grilla.appendChild(cellEl);
  }
  grillaBody.appendChild(grilla);
  panelGrilla.appendChild(grillaBody);
  main.appendChild(panelGrilla);

  // Acciones rápidas
  const panelAcc = U.el('div', { class: 'panel' });
  panelAcc.appendChild(U.el('div', { class: 'panel-head' }, [U.el('h3', { class: 'panel-title' }, 'Acciones')]));
  const accBody = U.el('div', { class: 'panel-body', style: { display: 'flex', gap: '8px', flexWrap: 'wrap' } });
  accBody.appendChild(U.el('button', { class: 'btn btn-primary', onclick: () => abrirRegistroMP(e) }, '+ Registrar MP'));
  accBody.appendChild(U.el('button', { class: 'btn', onclick: () => abrirCicloCorrectivo(e) }, '+ Ciclo correctivo'));
  accBody.appendChild(U.el('button', { class: 'btn', onclick: () => abrirNuevoEnvioST(e) }, '+ Envío a ST'));
  panelAcc.appendChild(accBody);
  main.appendChild(panelAcc);

  // Datos administrativos
  const panelDatos = U.el('div', { class: 'panel' });
  panelDatos.appendChild(U.el('div', { class: 'panel-head' }, [U.el('h3', { class: 'panel-title' }, 'Datos administrativos')]));
  const dataBody = U.el('div', { class: 'panel-body' });
  const dl = U.el('dl', { class: 'data-list' });
  const datos = [
    ['Familia', e.familia],
    ['Servicio', e.servicioClinico || '—'],
    ['Unidad', e.unidad || '—'],
    ['Ubicación', e.ubicacionFisica || '—'],
    ['Marca', e.marca || '—'],
    ['Modelo', e.modelo || '—'],
    ['Año adq.', e.anioAdquisicion || '—'],
    ['Año inst.', e.anioInstalacion || '—'],
    ['Procedencia', e.procedencia || '—'],
    ['Vida útil res.', e.vidaUtilResidualMeses ? e.vidaUtilResidualMeses + ' meses' : '—'],
    ['Clasificación', e.clasificacion || '—'],
    ['Frecuencia MP', (e.frecuenciaMeses || '—') + ' meses'],
    ['Modalidad', e.modalidadMP || '—'],
    ['En garantía', e.enGarantia ? 'Sí' + (e.fechaFinGarantia ? ' (hasta ' + U.formatDDMMAAAA(e.fechaFinGarantia) + ')' : '') : 'No']
  ];
  for (const [k, v] of datos) {
    dl.appendChild(U.el('dt', {}, k));
    dl.appendChild(U.el('dd', {}, String(v)));
  }
  dataBody.appendChild(dl);
  panelDatos.appendChild(dataBody);
  side.appendChild(panelDatos);

  cont.appendChild(main);
  cont.appendChild(side);
  return cont;
}

function tabHistorial(e) {
  const wrap = U.el('div', { class: 'panel' });
  wrap.appendChild(U.el('div', { class: 'panel-head' }, [U.el('h3', { class: 'panel-title' }, 'Historial completo de vida')]));
  const body = U.el('div', { class: 'panel-body' });
  const eventos = S.eventosDeEquipo(e.id);
  if (eventos.length === 0) {
    body.appendChild(U.el('div', { class: 'empty' }, [
      U.el('div', { class: 'empty-title' }, 'Sin historial'),
      U.el('div', { class: 'empty-sub' }, 'Aún no hay eventos registrados para este equipo.')
    ]));
  } else {
    const timeline = U.el('div', { class: 'timeline' });
    for (const ev of eventos) {
      const fmt = D.formatearEventoNatural(ev);
      const item = U.el('div', { class: 'timeline-item' });
      const tipoTxt = ev.tipo.replace(/_/g, ' ').toLowerCase();
      let tipoCls = '';
      if (ev.tipo === 'MP_EJECUTADA') tipoCls = 'is-mp';
      else if (ev.tipo === 'MP_NO_EJECUTADA_CAUSAL') tipoCls = 'is-causal';
      else if (['ENVIO_TALLER','RECEPCION_TALLER','SOLICITUD_CORRECTIVA','DIAGNOSTICO','COMPRA_REGISTRADA','REPARACION_COMPLETA'].includes(ev.tipo)) tipoCls = 'is-st';
      item.appendChild(U.el('div', { class: 'timeline-fecha' }, fmt.fechaTxt));
      const content = U.el('div', { class: 'timeline-content' });
      content.appendChild(U.el('span', { class: 'timeline-tipo ' + tipoCls }, tipoTxt.split(' ')[0]));
      content.appendChild(document.createTextNode(fmt.texto));
      item.appendChild(content);
      timeline.appendChild(item);
    }
    body.appendChild(timeline);
  }
  wrap.appendChild(body);
  return wrap;
}

function tabPendientesEquipo(e) {
  const wrap = U.el('div', { class: 'panel' });
  wrap.appendChild(U.el('div', { class: 'panel-head' }, [U.el('h3', { class: 'panel-title' }, 'Pendientes de este equipo')]));
  const body = U.el('div', { class: 'panel-body dense' });
  const pendientes = S.pendientesDeEquipo(e.id);
  if (pendientes.length === 0) {
    body.style.padding = '16px';
    body.appendChild(U.el('div', { class: 'empty' }, [
      U.el('div', { class: 'empty-title' }, 'Sin pendientes'),
      U.el('div', { class: 'empty-sub' }, 'Este equipo no tiene pendientes registrados.')
    ]));
  } else {
    const tabla = U.el('table');
    tabla.appendChild(U.el('thead', {}, [U.el('tr', {}, [
      U.el('th', {}, 'Título'), U.el('th', {}, 'Tipo'),
      U.el('th', {}, 'Responsable'), U.el('th', {}, 'Compromiso'),
      U.el('th', {}, 'Estado'), U.el('th', {}, '')
    ])]));
    const tbody = U.el('tbody');
    for (const p of pendientes) {
      const tr = U.el('tr', { class: 'is-clickable', onclick: () => abrirGestionPendiente(p.id) });
      tr.appendChild(U.el('td', { class: 'col-strong' }, p.titulo));
      tr.appendChild(U.el('td', { class: 'text-mono text-xs' }, p.tipo.replace(/_/g, ' ')));
      tr.appendChild(U.el('td', {}, p.responsable));
      tr.appendChild(U.el('td', { class: 'text-mono text-xs' }, p.fechaCompromiso ? U.formatDDMMAAAA(p.fechaCompromiso) : '—'));
      const tdEst = U.el('td');
      const cls = p.estado === 'CERRADO' ? 'badge-ok' : p.estado === 'EN_CURSO' ? 'badge-warn' : 'badge-accent';
      tdEst.appendChild(U.el('span', { class: 'badge ' + cls }, p.estado));

    }

}

async function marcarGrilla(e, mes, cell) {
  const cont = U.el('div');
  cont.innerHTML = `<div class="text-sm text-muted mb-12">Equipo: <b>${e.numeroSerie || e.numeroInventario}</b> · ${U.nombreMes(mes)} ${D.ANIO_VIGENTE}</div>`;
  const lbl = U.el('label', { class: 'label' }, 'Código de grilla');
  cont.appendChild(lbl);
  const sel = U.el('select', { class: 'select select-full' });
  for (const c of D.CODIGOS_GRILLA) {
    const o = U.el('option', { value: c }, c === 'VACIO' ? '— (vacío)' : c);
    if (cell.codigo === c) o.setAttribute('selected', '');
    sel.appendChild(o);
  }
  cont.appendChild(sel);

  const m = UI.modal({
    titulo: `Editar grilla — ${U.nombreMes(mes)}`,
    contenido: cont,
    footer: [
      U.el('button', { class: 'btn', onclick: () => m.cerrar() }, 'Cancelar'),
      U.el('button', { class: 'btn btn-primary', onclick: async () => {
        const nuevo = sel.value;
        const anterior = cell.codigo;
        const id = cell.id || U.uuid();
        const obj = { id, equipoId: e.id, anio: D.ANIO_VIGENTE, mes, codigo: nuevo, origen: 'sistema' };
        await DB.put('celdasGrilla', obj);
        await S.hidratar();
        await registrarEvento({
          equipoId: e.id, tipo: 'EDICION_REGISTRO',
          descripcion: `Celda de grilla de ${U.nombreMes(mes)} actualizada: ${anterior} → ${nuevo}`,
          responsable: 'Operador'
        });
        m.cerrar();
        U.toast('Grilla actualizada', 'ok');
        UI.render();
      }}, 'Guardar')
    ]
  });
}

// ─── FORMULARIO DE REGISTRO MP ─────────────────────────────────
function abrirRegistroMP(e) {
  const cont = U.el('div');
  const hoy = U.hoyISO();
  const asignacion = S.asignacionDeEquipoMes(e.id, UI.mesActual.anio, UI.mesActual.mes);
  const responsableSugerido = asignacion ? asignacion.responsable : null;

  let resultadoSel = null;     // 'SI' o 'CAUSAL' o 'C2' etc
  let causalSel = null;
  let usarResponsableSugerido = !!responsableSugerido;
  let responsableManual = '';
  let motivoCambio = '';

  // Avisos previos a guardado (vinculaciones, retiro)
  const avisosBox = U.el('div');

  // Sección Fecha
  const fechaField = U.el('div', { class: 'field' }, [
    U.el('label', { class: 'label' }, [document.createTextNode('Fecha de ejecución '), U.el('span', { class: 'required' }, '*')]),
    U.el('input', { class: 'input', type: 'date', id: 'mp-fecha', value: hoy })
  ]);
  cont.appendChild(fechaField);

  // Sección Resultado
  const resultLbl = U.el('label', { class: 'label' }, [document.createTextNode('Resultado '), U.el('span', { class: 'required' }, '*')]);
  cont.appendChild(resultLbl);
  const rgroup = U.el('div', { class: 'radio-group mb-12' });
  const pillSi = U.el('label', { class: 'radio-pill', onclick: () => seleccionarResultado('SI') }, [U.el('span', {}, '✓'), U.el('span', {}, 'Sí ejecutada')]);
  const pillCausal = U.el('label', { class: 'radio-pill', onclick: () => seleccionarResultado('CAUSAL') }, [U.el('span', {}, '⚠'), U.el('span', {}, 'No ejecutada (causal)')]);
  rgroup.appendChild(pillSi);
  rgroup.appendChild(pillCausal);
  cont.appendChild(rgroup);

  // Sección dinámica: estado SI/NO ejecutada o lista de causales
  const seccionDinamica = U.el('div');
  cont.appendChild(seccionDinamica);

  // Sección Ejecutor con confirmar/cambiar
  const ejecutorBox = U.el('div');
  cont.appendChild(ejecutorBox);
  renderEjecutor();

  // Sección Observaciones
  cont.appendChild(U.el('div', { class: 'field' }, [
    U.el('label', { class: 'label' }, 'Observaciones del técnico'),
    U.el('textarea', { class: 'textarea', id: 'mp-obs', rows: '3', placeholder: 'Recomendaciones, anomalías detectadas, etc.' })
  ]));

  cont.appendChild(avisosBox);

  function renderEjecutor() {
    ejecutorBox.innerHTML = '';
    if (responsableSugerido && usarResponsableSugerido) {
      const aviso = U.el('div', { class: 'aviso aviso-info' });
      aviso.innerHTML = `<div style="flex:1"><strong>Responsable asignado:</strong> ${responsableSugerido}<br><span class="text-xs">Asignado en planilla del mes (${U.nombreMes(UI.mesActual.mes)} ${UI.mesActual.anio}).</span></div>`;
      const accs = U.el('div', { style: { display: 'flex', gap: '6px', marginLeft: '8px' } });
      accs.appendChild(U.el('button', { class: 'btn btn-sm btn-primary' }, 'Confirmar'));
      accs.appendChild(U.el('button', { class: 'btn btn-sm', onclick: (ev) => { ev.preventDefault(); usarResponsableSugerido = false; renderEjecutor(); } }, 'Cambiar'));
      aviso.appendChild(accs);
      ejecutorBox.appendChild(aviso);
    } else {
      ejecutorBox.appendChild(U.el('div', { class: 'field' }, [
        U.el('label', { class: 'label' }, [document.createTextNode('Ejecutor '), U.el('span', { class: 'required' }, '*')]),
        (() => {
          const sel = U.el('select', { class: 'select select-full', id: 'mp-ejecutor', onchange: (ev) => { responsableManual = ev.target.value; } });
          sel.appendChild(U.el('option', { value: '' }, '— Seleccionar técnico —'));
          for (const t of S.tecnicos.filter(t => t.activo)) {
            const o = U.el('option', { value: t.nombreCanonico }, t.nombreCanonico);
            sel.appendChild(o);
          }
          return sel;
        })()
      ]));
      if (responsableSugerido) {
        ejecutorBox.appendChild(U.el('div', { class: 'field' }, [
          U.el('label', { class: 'label' }, [document.createTextNode('Motivo del cambio '), U.el('span', { class: 'required' }, '*')]),
          U.el('input', { class: 'input', id: 'mp-motivo', placeholder: 'Ej: el técnico asignado se encuentra en otro hospital' })
        ]));
        ejecutorBox.appendChild(U.el('div', { class: 'aviso aviso-warn', html: `Responsable asignado original: <strong>${responsableSugerido}</strong>` }));
      }
    }
  }

  function seleccionarResultado(tipo) {
    resultadoSel = tipo;
    pillSi.classList.toggle('is-selected', tipo === 'SI');
    pillSi.classList.toggle('is-ok', tipo === 'SI');
    pillCausal.classList.toggle('is-selected', tipo === 'CAUSAL');
    pillCausal.classList.toggle('is-warn', tipo === 'CAUSAL');
    seccionDinamica.innerHTML = '';
    avisosBox.innerHTML = '';
    if (tipo === 'SI') {
      seccionDinamica.appendChild(U.el('label', { class: 'label' }, 'Estado final del equipo'));
      const rg = U.el('div', { class: 'radio-group mb-12' });
      const opOp = U.el('label', { class: 'radio-pill', onclick: () => seleccionarEstadoFinal('OPERATIVO') }, [U.el('span', {}, '✓'), U.el('span', {}, 'Operativo')]);
      const opNo = U.el('label', { class: 'radio-pill', onclick: () => seleccionarEstadoFinal('NO_OPERATIVO') }, [U.el('span', {}, '⚠'), U.el('span', {}, 'No operativo')]);
      seccionDinamica.dataset.estadoFinal = 'OPERATIVO';
      opOp.classList.add('is-selected', 'is-ok');
      rg.appendChild(opOp); rg.appendChild(opNo);
      seccionDinamica.appendChild(rg);
      seccionDinamica._refsEstado = { opOp, opNo };

      function seleccionarEstadoFinal(v) {
        seccionDinamica.dataset.estadoFinal = v;
        opOp.classList.toggle('is-selected', v === 'OPERATIVO');
        opOp.classList.toggle('is-ok', v === 'OPERATIVO');
        opNo.classList.toggle('is-selected', v === 'NO_OPERATIVO');
        opNo.classList.toggle('is-warn', v === 'NO_OPERATIVO');
        avisosBox.innerHTML = '';
        if (v === 'NO_OPERATIVO') {
          avisosBox.appendChild(U.el('div', { class: 'aviso aviso-accent', html: 'Al guardar se abrirá el flujo de <strong>solicitud de trabajo correctiva</strong>: pedirá folio SIGEM o creará un pendiente.' }));
        }
      }
    } else {
      seccionDinamica.appendChild(U.el('label', { class: 'label mb-8' }, 'Causal'));
      const list = U.el('div', { class: 'causal-list mb-12' });
      for (const [code, def] of Object.entries(D.CAUSALES)) {
        const op = U.el('div', { class: 'causal-option', onclick: () => seleccionarCausal(code, op) });
        op.appendChild(U.el('div', { class: 'causal-option-code' }, code + ' · GRUPO ' + def.grupo));
        op.appendChild(U.el('div', {}, def.texto));
        list.appendChild(op);
      }
      seccionDinamica.appendChild(list);
    }
  }

  function seleccionarCausal(code, opEl) {
    causalSel = code;
    seccionDinamica.querySelectorAll('.causal-option').forEach(x => x.classList.remove('is-selected'));
    opEl.classList.add('is-selected');
    chequearVinculosYAvisos(code);
  }

  function chequearVinculosYAvisos(code) {
    avisosBox.innerHTML = '';
    const causal = D.CAUSALES[code];

    // Si causal en uso >30d → alerta retiro
    const dias = D.diasEnCausal(e, S.mantenciones, code);
    if (dias !== null && dias > 30) {
      avisosBox.appendChild(U.el('div', { class: 'aviso aviso-accent', html: `Este equipo lleva <strong>${dias} días</strong> con causal ${code}. <strong>Considerar retiro por seguridad.</strong>` }));
    }

    // Vinculación C2 → envío a ST
    if (causal.requiereVinculo === 'ENVIO_ST') {
      const envio = S.envioSTAbiertoDe(e.id);
      if (envio) {
        avisosBox.appendChild(U.el('div', { class: 'aviso aviso-ok', html: `Se vinculará al envío a servicio técnico existente (eslabón abierto en ciclo activo).` }));
      } else {
        const box = U.el('div', { class: 'aviso aviso-warn' });
        box.innerHTML = `<div style="flex:1"><strong>No hay envío a servicio técnico abierto.</strong> Al guardar se ofrecerá crear uno y vincular.</div>`;
        avisosBox.appendChild(box);
      }
    }
    // Vinculación C3 → solicitud de trabajo
    if (causal.requiereVinculo === 'SOLICITUD_TRABAJO') {
      const st = S.solicitudTrabajoAbiertaDe(e.id);
      if (st) {
        avisosBox.appendChild(U.el('div', { class: 'aviso aviso-ok', html: `Se vinculará a la solicitud de trabajo existente (pendiente <strong>${st.titulo}</strong>).` }));
      } else {
        avisosBox.appendChild(U.el('div', { class: 'aviso aviso-warn', html: `<strong>No hay solicitud de trabajo activa.</strong> Al guardar se ofrecerá crear una (con folio SIGEM o como pendiente).` }));
      }
    }
  }

  const m = UI.modal({
    titulo: `Registrar MP — ${e.numeroSerie || e.numeroInventario}`,
    ancho: 'large',
    contenido: cont,
    footer: [
      U.el('button', { class: 'btn', onclick: () => m.cerrar() }, 'Cancelar'),
      U.el('button', { class: 'btn btn-primary', onclick: async () => {
        const fecha = document.getElementById('mp-fecha').value;
        if (!fecha) return U.toast('Indica una fecha', 'error');
        if (!resultadoSel) return U.toast('Indica el resultado', 'error');

        let ejecutor = '';
        if (responsableSugerido && usarResponsableSugerido) {
          ejecutor = responsableSugerido;
        } else {
          ejecutor = document.getElementById('mp-ejecutor')?.value;
          if (!ejecutor) return U.toast('Selecciona un ejecutor', 'error');
          if (responsableSugerido) {
            motivoCambio = document.getElementById('mp-motivo')?.value.trim();
            if (!motivoCambio) return U.toast('Indica el motivo del cambio de responsable', 'error');
          }
        }

        const obs = document.getElementById('mp-obs').value;
        let resultadoFinal, estadoFinal;
        if (resultadoSel === 'SI') {
          resultadoFinal = 'SI';
          estadoFinal = seccionDinamica.dataset.estadoFinal || 'OPERATIVO';
        } else {
          if (!causalSel) return U.toast('Selecciona la causal', 'error');
          resultadoFinal = causalSel;
          estadoFinal = D.CAUSALES[causalSel].grupo === 'B' ? 'NO_OPERATIVO' : 'OPERATIVO';
          if (causalSel === 'C2') estadoFinal = 'SERVICIO_TECNICO';
          if (causalSel === 'C5' || causalSel === 'C6' || causalSel === 'C7' || causalSel === 'C8') estadoFinal = 'OPERATIVO';
        }

        const mp = {
          id: U.uuid(),
          equipoId: e.id,
          fechaRealEjecucion: fecha,
          resultado: resultadoFinal,
          ejecutor,
          motivoCambioEjecutor: motivoCambio || null,
          observacionesTecnico: obs || '',
          estadoFinalEquipo: estadoFinal,
          origen: 'manual',
          eliminado: false,
          logEdiciones: [],
          creadoEn: new Date().toISOString()
        };

        // Detectar inconsistencias
        const celdaMes = S.celdasDeEquipo(e.id)[U.parseISO(fecha).getMonth()];
        const inconsistencia = detectarInconsistencia(celdaMes, resultadoFinal);

        await DB.put('mantenciones', mp);
        S.mantenciones.push(mp);

        // Registrar evento en historial
        if (resultadoFinal === 'SI') {
          await registrarEvento({
            equipoId: e.id, tipo: 'MP_EJECUTADA',
            descripcion: `MP ejecutada por ${ejecutor}`,
            responsable: ejecutor,
            payload: { fecha, estadoFinal, observaciones: obs }
          });
        } else {
          await registrarEvento({
            equipoId: e.id, tipo: 'MP_NO_EJECUTADA_CAUSAL',
            descripcion: `Causal ${causalSel}: ${D.CAUSALES[causalSel].texto}`,
            responsable: ejecutor,
            payload: { fecha, causal: causalSel, observaciones: obs }
          });
        }

        // Consecuencias en estado del equipo
        await aplicarConsecuenciasMP(e, mp);

        m.cerrar();

        // Inconsistencia
        if (inconsistencia) {
          U.toast(inconsistencia, 'warn');
        }

        // Flujos posteriores según tipo
        if (resultadoSel === 'SI' && estadoFinal === 'NO_OPERATIVO') {
          await abrirFlujoSolicitudTrabajo(e, mp);
        } else if (resultadoSel === 'CAUSAL' && causalSel === 'C2') {
          const envio = S.envioSTAbiertoDe(e.id);
          if (!envio) {
            const ok = await U.confirm('No hay envío a servicio técnico abierto para este equipo. ¿Crear uno ahora?', { titulo: 'Vincular causal C2' });
            if (ok) await abrirNuevoEnvioST(e, mp);
          }
        } else if (resultadoSel === 'CAUSAL' && causalSel === 'C3') {
          const st = S.solicitudTrabajoAbiertaDe(e.id);
          if (!st) {
            const ok = await U.confirm('No hay solicitud de trabajo activa. ¿Crear una ahora?', { titulo: 'Vincular causal C3' });
            if (ok) await abrirFlujoSolicitudTrabajo(e, mp);
          }
        }

        U.toast('Mantención registrada', 'ok');
        UI.render();
      }}, 'Guardar')
    ]
  });
}

function detectarInconsistencia(celda, resultado) {
  if (!celda) return null;
  const cod = celda.codigo;
  if (resultado === 'SI' && D.CAUSALES[cod]) {
    return `Inconsistencia: el sistema tenía registrada la causal ${cod} para este mes, pero ahora se registra como ejecutada.`;
  }
  return null;
}

async function aplicarConsecuenciasMP(equipo, mp) {
  const eq = { ...equipo, actualizadoEn: new Date().toISOString() };
  let nuevoEstado = equipo.estadoOperacional;

  if (mp.resultado === 'SI') {
    nuevoEstado = mp.estadoFinalEquipo;
  } else if (D.CAUSALES[mp.resultado]) {
    if (mp.resultado === 'C2') nuevoEstado = 'SERVICIO_TECNICO';
    else if (D.CAUSALES[mp.resultado].grupo === 'B') nuevoEstado = 'NO_OPERATIVO';
  }

  if (nuevoEstado !== equipo.estadoOperacional) {
    eq.estadoOperacional = nuevoEstado;
    await DB.put('equipos', eq);
    const idx = S.equipos.findIndex(x => x.id === eq.id);
    if (idx >= 0) S.equipos[idx] = eq;
    await registrarEvento({
      equipoId: eq.id, tipo: 'CAMBIO_ESTADO',
      descripcion: `${equipo.estadoOperacional} → ${nuevoEstado} por MP`,
      responsable: mp.ejecutor,
      payload: { anterior: equipo.estadoOperacional, nuevo: nuevoEstado, mpId: mp.id }
    });
  }

  // Actualizar celda
  const mes = U.parseISO(mp.fechaRealEjecucion).getMonth() + 1;
  let celda = S.celdas.find(c => c.equipoId === eq.id && c.anio === D.ANIO_VIGENTE && c.mes === mes);
  if (!celda) {
    celda = { id: U.uuid(), equipoId: eq.id, anio: D.ANIO_VIGENTE, mes, codigo: 'VACIO', origen: 'sistema' };
    S.celdas.push(celda);
  }
  celda.codigo = mp.resultado;
  celda.origen = 'sistema';
  await DB.put('celdasGrilla', celda);
}

      U.el('button', { class: 'btn btn-primary', onclick: async () => {

        });

async function abrirFlujoSolicitudTrabajo(e, mpOrigen = null) {
  const cont = U.el('div');
  cont.innerHTML = `
    <p class="text-sm text-muted mb-16">Si tienes el folio SIGEM, se abrirá inmediatamente un ciclo correctivo. Si todavía no lo tienes, se creará un pendiente para gestionarlo con la supervisora del servicio.</p>
    <div class="field">
      <label class="label">Folio de solicitud SIGEM <span class="text-xs text-muted">(si lo tienes)</span></label>
      <input class="input" id="sol-folio" placeholder="Ej: ST-2026-00342">
    </div>
    <div class="field">
      <label class="label">Descripción del problema <span class="required">*</span></label>
      <textarea class="textarea" id="sol-desc" rows="3" placeholder="Ej: equipo no enciende; alarma persistente; falta accesorio…"></textarea>
    </div>
    <div class="field-row">
      <div class="field">
        <label class="label">Fecha compromiso <span class="required">*</span></label>
        <input class="input" type="date" id="sol-fecha">
      </div>
      <div class="field">
        <label class="label">Responsable de gestión <span class="required">*</span></label>
        <div id="sol-resp-mount"></div>
      </div>
    </div>`;
  // Sugerir fecha compromiso 5 días hábiles
  const fechaSug = new Date(); fechaSug.setDate(fechaSug.getDate() + 5);
  cont.querySelector('#sol-fecha').value = U.formatISO(fechaSug);
  // La supervisora del servicio se ofrece como opción extra (típicamente quien gestiona el folio SIGEM)
  const supervisor = contactoSupervisorDe(e.servicioClinico);
  const respField = UI.selectResponsable({
    id: 'sol-resp',
    value: supervisor || '',
    extras: supervisor ? [supervisor] : []
  });
  cont.querySelector('#sol-resp-mount').appendChild(respField);

  const m = UI.modal({
    titulo: 'Solicitud de trabajo correctiva',
    ancho: 'large',
    contenido: cont,
    footer: [
      U.el('button', { class: 'btn', onclick: () => m.cerrar() }, 'Cancelar'),
      U.el('button', { class: 'btn btn-primary', onclick: async () => {
        const folio = cont.querySelector('#sol-folio').value.trim();
        const desc = cont.querySelector('#sol-desc').value.trim();
        const fecha = cont.querySelector('#sol-fecha').value;
        const resp = respField.getValue();
        if (!desc) return U.toast('Indica la descripción', 'error');
        if (!fecha) return U.toast('Indica la fecha compromiso', 'error');
        if (!resp) return U.toast('Indica el responsable', 'error');

        if (folio) {
          // Crear ciclo correctivo directo
          await crearCicloCorrectivo(e, { folioSigem: folio, descripcion: desc, fechaApertura: U.hoyISO(), origenMP: mpOrigen?.id });
          await registrarEvento({
            equipoId: e.id, tipo: 'SOLICITUD_CORRECTIVA',
            descripcion: desc, responsable: resp,
            payload: { folioSigem: folio }
          });
          U.toast('Ciclo correctivo abierto con folio ' + folio, 'ok');
        } else {
          // Crear pendiente
          const pend = {
            id: U.uuid(), tipo: 'SOLICITUD_TRABAJO',
            equipoId: e.id,
            titulo: `Gestionar folio SIGEM para ${e.familia} ${e.numeroSerie || ''}`,
            descripcion: desc,
            responsable: resp,
            fechaCreacion: U.hoyISO(),
            fechaCompromiso: fecha,
            estado: 'ABIERTO',
            origen: 'AUTO_SOLICITUD_TRABAJO',
            subtareas: [
              { id: U.uuid(), texto: 'Contactar supervisora del servicio', hecha: false },
              { id: U.uuid(), texto: 'Solicitar emisión de folio SIGEM', hecha: false },
              { id: U.uuid(), texto: 'Al recibir folio, convertir en ciclo correctivo', hecha: false }
            ],
            log: [{ fecha: new Date().toISOString(), autor: 'Operador', accion: 'creado', nota: 'Originado al registrar MP con equipo no operativo (sin folio aún).' }],
            meta: { mpOrigenId: mpOrigen?.id }
          };
          await DB.put('pendientes', pend);
          S.pendientes.push(pend);
          await registrarEvento({
            equipoId: e.id, tipo: 'SOLICITUD_PENDIENTE',
            descripcion: desc, responsable: resp,
            payload: { fechaCompromiso: fecha, pendienteId: pend.id }
          });
          U.toast('Pendiente creado · fecha compromiso ' + U.formatDDMMAAAA(fecha), 'ok');
        }
        m.cerrar();
        UI.render();
      }}, folio => 'Guardar')
    ]
  });
}

function contactoSupervisorDe(servicio) {
  const c = S.contactos.find(c => c.servicioClinico === servicio);
  if (!c || !c.supervisor || !c.supervisor.nombre) return '';
  return c.supervisor.nombre + ' ' + (c.supervisor.apellido || '');
}

async function crearCicloCorrectivo(equipo, datos) {
  const ciclo = {
    id: U.uuid(), equipoId: equipo.id,
    folioSigem: datos.folioSigem || null,
    descripcion: datos.descripcion,
    fechaApertura: datos.fechaApertura || U.hoyISO(),
    fechaCierre: null,
    estado: 'ABIERTO',
    ruta: null,
    creadoEn: new Date().toISOString(),
    origenMP: datos.origenMP || null
  };
  const eslabonSol = {
    id: U.uuid(), cicloId: ciclo.id,
    tipo: 'SOLICITUD', estado: 'COMPLETADO',
    fecha: ciclo.fechaApertura,
    datos: { folioSigem: ciclo.folioSigem, descripcion: ciclo.descripcion }
  };
  await DB.put('ciclos', ciclo);
  await DB.put('eslabones', eslabonSol);
  S.ciclos.push(ciclo);
  S.eslabones.push(eslabonSol);
  return ciclo;
}

function renderCicloCard(c) {
  const eq = S.equipoPorId(c.equipoId);
  const eslabones = S.eslabones.filter(es => es.cicloId === c.id);
  const panel = U.el('div', { class: 'panel' });
  panel.appendChild(U.el('div', { class: 'panel-head' }, [
    U.el('div', {}, [
      U.el('h3', { class: 'panel-title' }, (eq ? eq.familia + ' · ' + (eq.numeroSerie || eq.numeroInventario) : 'Equipo eliminado')),
      U.el('div', { class: 'text-xs text-muted' }, [
        c.folioSigem ? document.createTextNode('Folio SIGEM ' + c.folioSigem + ' · ') : null,
        document.createTextNode('Abierto ' + U.formatDDMMAAAA(c.fechaApertura))
      ])
    ]),
    U.el('div', { class: 'page-actions' }, [
      eq ? U.el('button', { class: 'btn btn-sm', onclick: () => UI.go('equipo', eq.id) }, 'Ver equipo') : null,
      c.estado === 'ABIERTO' ? U.el('button', { class: 'btn btn-sm btn-primary', onclick: () => avanzarEslabon(c) }, '+ Avanzar') : null
    ])
  ]));
  const body = U.el('div', { class: 'panel-body' });
  body.appendChild(U.el('div', { class: 'text-sm mb-12' }, c.descripcion || ''));
  const eslabonesDiv = U.el('div', { class: 'eslabones' });
  const orden = c.ruta ? D.RUTAS[c.ruta] : ['SOLICITUD','DIAGNOSTICO','...','REPARACION'];
  for (const tipo of orden) {
    const es = eslabones.find(x => x.tipo === tipo);
    const div = U.el('div', { class: 'eslabon ' + (es && es.estado === 'COMPLETADO' ? 'is-completado' : 'is-pendiente') });
    div.appendChild(U.el('div', { class: 'eslabon-tipo' }, tipo));
    div.appendChild(U.el('div', { class: 'eslabon-estado' }, es ? (es.fecha ? U.formatDDMMAAAA(es.fecha) : '✓') : '—'));
    eslabonesDiv.appendChild(div);
  }
  body.appendChild(eslabonesDiv);
  panel.appendChild(body);
  return panel;
}

async function avanzarEslabon(ciclo) {
  const eslabones = S.eslabones.filter(es => es.cicloId === ciclo.id);
  const eq = S.equipoPorId(ciclo.equipoId);
  // Determinar siguiente tipo según ruta
  let ruta = ciclo.ruta;
  if (!ruta) {
    // Preguntar ruta si no está definida
    const cont = U.el('div');
    cont.innerHTML = `<p class="text-sm mb-12">¿Cuál es el flujo de este ciclo?</p>`;
    const rg = U.el('div', { class: 'radio-group' });
    let sel = 'A';
    for (const [k, v] of Object.entries({
      A: 'Reparación directa (sin compra ni envío)',
      B: 'Compra de repuestos → envío → recepción',
      C: 'Envío a taller → compra → recepción'
    })) {
      const p = U.el('label', { class: 'radio-pill' + (k === 'A' ? ' is-selected' : '') }, [U.el('span', {}, k), U.el('span', {}, v)]);
      p.addEventListener('click', () => {
        sel = k;
        rg.querySelectorAll('.radio-pill').forEach(x => x.classList.remove('is-selected'));
        p.classList.add('is-selected');
      });
      rg.appendChild(p);
    }
    cont.appendChild(rg);
    await new Promise(resolve => {
      const m = UI.modal({
        titulo: 'Definir ruta del ciclo',
        contenido: cont,
        footer: [
          U.el('button', { class: 'btn', onclick: () => { m.cerrar(); resolve(); } }, 'Cancelar'),
          U.el('button', { class: 'btn btn-primary', onclick: async () => {
            ciclo.ruta = sel; ruta = sel;
            await DB.put('ciclos', ciclo);
            m.cerrar(); resolve();
          }}, 'Confirmar ruta')
        ]
      });
    });
    if (!ciclo.ruta) return;
  }
  const orden = D.RUTAS[ruta];
  const siguiente = orden.find(t => !eslabones.some(es => es.tipo === t));
  if (!siguiente) return U.toast('Ciclo completo', 'ok');

  const cont = U.el('div');
  cont.innerHTML = `<p class="text-sm mb-12">Registrar eslabón: <strong>${siguiente}</strong></p>
    <div class="field-row">
      <div class="field"><label class="label">Fecha</label><input class="input" type="date" id="es-fecha" value="${U.hoyISO()}"></div>
      <div class="field"><label class="label">Documento / folio</label><input class="input" id="es-doc"></div>
    </div>
    <div class="field"><label class="label">Detalle</label><textarea class="textarea" id="es-det" rows="3"></textarea></div>`;
  const m = UI.modal({
    titulo: 'Registrar eslabón',
    contenido: cont,
    footer: [
      U.el('button', { class: 'btn', onclick: () => m.cerrar() }, 'Cancelar'),
      U.el('button', { class: 'btn btn-primary', onclick: async () => {
        const fecha = cont.querySelector('#es-fecha').value;
        const doc = cont.querySelector('#es-doc').value.trim();
        const det = cont.querySelector('#es-det').value.trim();
        const eslabon = {
          id: U.uuid(), cicloId: ciclo.id,
          tipo: siguiente, estado: 'COMPLETADO',
          fecha,
          datos: { documento: doc, detalle: det }
        };
        await DB.put('eslabones', eslabon);
        S.eslabones.push(eslabon);

        // Mapear a eventos del historial
        const tipoEv = {
          DIAGNOSTICO: 'DIAGNOSTICO',
          COMPRA: 'COMPRA_REGISTRADA',
          ENVIO: 'ENVIO_TALLER',
          RECEPCION: 'RECEPCION_TALLER',
          REPARACION: 'REPARACION_COMPLETA'
        }[siguiente];
        if (tipoEv) {
          await registrarEvento({
            equipoId: eq.id, tipo: tipoEv,
            descripcion: det || siguiente, responsable: 'Operador',
            payload: { cicloId: ciclo.id, documento: doc }
          });
        }
        // Si es RECEPCION, equipo vuelve a no operativo (en reparación), si es REPARACION → operativo y ciclo cerrado
        if (siguiente === 'RECEPCION' && eq.estadoOperacional === 'SERVICIO_TECNICO') {
          const eq2 = { ...eq, estadoOperacional: 'NO_OPERATIVO', actualizadoEn: new Date().toISOString() };
          await DB.put('equipos', eq2);
          const idx = S.equipos.findIndex(x => x.id === eq.id);
          if (idx >= 0) S.equipos[idx] = eq2;
        }
        if (siguiente === 'REPARACION') {
          const eq2 = { ...eq, estadoOperacional: 'OPERATIVO', actualizadoEn: new Date().toISOString() };
          await DB.put('equipos', eq2);
          const idx = S.equipos.findIndex(x => x.id === eq.id);
          if (idx >= 0) S.equipos[idx] = eq2;
          ciclo.estado = 'CERRADO';
          ciclo.fechaCierre = fecha;
          await DB.put('ciclos', ciclo);
          await registrarEvento({
            equipoId: eq.id, tipo: 'CAMBIO_ESTADO',
            descripcion: `Equipo operativo tras cierre de ciclo correctivo`, responsable: 'Operador',
            payload: { anterior: eq.estadoOperacional, nuevo: 'OPERATIVO' }
          });
        }
        m.cerrar();
        U.toast('Eslabón registrado', 'ok');
        UI.render();
      }}, 'Guardar')
    ]
  });
}

function abrirGestionPendiente(pendienteId) {
  const p = S.pendientes.find(x => x.id === pendienteId);
  if (!p) return;
  if (!p.subtareas) p.subtareas = [];
  if (!p.log) p.log = [];

  const cont = U.el('div');
  cont.innerHTML = `
    <div class="text-sm mb-16">${p.descripcion || ''}</div>
    <div class="field-row mb-16">
      <div class="field"><label class="label">Responsable</label><div id="ge-resp-mount"></div></div>
      <div><div class="label">Compromiso</div><div class="text-strong">${p.fechaCompromiso ? U.formatDDMMAAAA(p.fechaCompromiso) : '—'}</div></div>
    </div>`;
  // Responsable editable (mismo helper que el alta del pendiente).
  // Si el responsable actual no está en la lista de técnicos, cae automáticamente
  // a "Otro…" preservando el valor previo — útil para pendientes históricos.
  const respGE = UI.selectResponsable({ id: 'ge-resp', value: p.responsable || '' });
  cont.querySelector('#ge-resp-mount').appendChild(respGE);
  respGE.querySelector('select').addEventListener('change', async () => {
    const nuevo = respGE.getValue();
    if (!nuevo || nuevo === p.responsable) return;
    const previo = p.responsable;
    p.responsable = nuevo;
    p.log.push({
      fecha: new Date().toISOString(), autor: 'Operador',
      accion: 'reasignó', nota: `Responsable: ${previo || '—'} → ${nuevo}`
    });
    await DB.put('pendientes', p);
    await registrarEvento({
      equipoId: p.equipoId, tipo: 'PENDIENTE_ACTUALIZADO',
      descripcion: `Reasignación: ${previo || '—'} → ${nuevo}`,
      responsable: 'Operador'
    });
    if (typeof renderLog === 'function') renderLog();
    U.toast('Responsable actualizado', 'ok');
  });
  // El input "Otro…" se confirma con blur (cuando el usuario termina de escribir).
  respGE.querySelector('input').addEventListener('blur', async () => {
    const nuevo = respGE.getValue();
    if (!nuevo || nuevo === p.responsable) return;
    const previo = p.responsable;
    p.responsable = nuevo;
    p.log.push({
      fecha: new Date().toISOString(), autor: 'Operador',
      accion: 'reasignó', nota: `Responsable: ${previo || '—'} → ${nuevo}`
    });
    await DB.put('pendientes', p);
    if (typeof renderLog === 'function') renderLog();
    U.toast('Responsable actualizado', 'ok');
  });

  // SUBTAREAS
  cont.appendChild(U.el('label', { class: 'label' }, 'Subtareas'));
  const subList = U.el('div', { class: 'mb-12' });
  function renderSubtareas() {
    subList.innerHTML = '';
    for (const st of p.subtareas) {
      const row = U.el('div', { class: 'subtarea' + (st.hecha ? ' is-done' : '') });
      const cb = U.el('input', {
        type: 'checkbox',
        onchange: async (e) => {
          st.hecha = e.target.checked;
          row.classList.toggle('is-done', st.hecha);
          p.log.push({
            fecha: new Date().toISOString(), autor: 'Operador',
            accion: st.hecha ? 'completó subtarea' : 'reabrió subtarea',
            nota: st.texto
          });
          await DB.put('pendientes', p);
          await registrarEvento({
            equipoId: p.equipoId, tipo: 'PENDIENTE_ACTUALIZADO',
            descripcion: (st.hecha ? 'Completó subtarea: ' : 'Reabrió subtarea: ') + st.texto,
            responsable: 'Operador'
          });
          renderLog();
        }
      });
      if (st.hecha) cb.checked = true;
      row.appendChild(cb);
      row.appendChild(U.el('div', { class: 'subtarea-texto' }, st.texto));
      row.appendChild(U.el('button', {
        class: 'subtarea-del', title: 'Eliminar',
        onclick: async () => {
          p.subtareas = p.subtareas.filter(x => x.id !== st.id);
          await DB.put('pendientes', p);
          renderSubtareas();
        }
      }, '×'));
      subList.appendChild(row);
    }
  }
  renderSubtareas();
  cont.appendChild(subList);
  const addRow = U.el('div', { class: 'flex gap-8 mb-16' });
  const addInput = U.el('input', { class: 'input', style: { flex: '1' }, placeholder: 'Agregar subtarea…' });
  addRow.appendChild(addInput);
  addRow.appendChild(U.el('button', {
    class: 'btn btn-sm',
    onclick: async () => {
      const v = addInput.value.trim();
      if (!v) return;
      p.subtareas.push({ id: U.uuid(), texto: v, hecha: false });
      addInput.value = '';
      await DB.put('pendientes', p);
      renderSubtareas();
    }
  }, '+ Agregar'));
  cont.appendChild(addRow);

  // LOG DE ACTUALIZACIONES
  cont.appendChild(U.el('label', { class: 'label' }, 'Log de actualizaciones'));
  const logBox = U.el('div', { class: 'mb-12' });
  function renderLog() {
    logBox.innerHTML = '';
    const orden = [...p.log].sort((a, b) => b.fecha.localeCompare(a.fecha));
    if (orden.length === 0) {
      logBox.appendChild(U.el('div', { class: 'text-sm text-muted' }, 'Sin actualizaciones aún.'));
    } else {
      for (const l of orden) {
        const row = U.el('div', { class: 'log-actualizacion' });
        row.appendChild(U.el('div', { class: 'log-actualizacion-meta' }, U.formatDateTime(l.fecha) + ' · ' + l.autor + (l.accion ? ' · ' + l.accion : '')));
        row.appendChild(U.el('div', {}, l.nota));
        logBox.appendChild(row);
      }
    }
  }
  renderLog();
  cont.appendChild(logBox);

  const newLogInput = U.el('textarea', { class: 'textarea', rows: '2', placeholder: 'Nueva actualización (avance, llamada, gestión)…' });
  cont.appendChild(newLogInput);
  cont.appendChild(U.el('div', { class: 'flex gap-8 mt-8 mb-12' }, [
    U.el('button', {
      class: 'btn btn-sm',
      onclick: async () => {
        const v = newLogInput.value.trim();
        if (!v) return;
        p.log.push({ fecha: new Date().toISOString(), autor: 'Operador', accion: 'comentario', nota: v });
        newLogInput.value = '';
        await DB.put('pendientes', p);
        await registrarEvento({
          equipoId: p.equipoId, tipo: 'PENDIENTE_ACTUALIZADO',
          descripcion: 'Comentario: ' + v, responsable: 'Operador'
        });
        renderLog();
      }
    }, '+ Agregar actualización')
  ]));

  // FOOTER conditional: si es SOLICITUD_TRABAJO sin folio, ofrecer "Recibí el folio"
  const footers = [];
  footers.push(U.el('button', { class: 'btn', onclick: () => m.cerrar() }, 'Cerrar'));
  if (p.tipo === 'SOLICITUD_TRABAJO' && p.estado !== 'CERRADO') {
    footers.push(U.el('button', {
      class: 'btn btn-ok',
      onclick: async () => {
        const folio = await U.prompt('N° de folio SIGEM recibido', { titulo: 'Vincular folio y abrir ciclo' });
        if (!folio) return;
        const eq = S.equipoPorId(p.equipoId);
        await crearCicloCorrectivo(eq, {
          folioSigem: folio,
          descripcion: p.descripcion,
          fechaApertura: U.hoyISO()
        });
        await registrarEvento({
          equipoId: p.equipoId, tipo: 'SOLICITUD_CORRECTIVA',
          descripcion: p.descripcion, responsable: p.responsable,
          payload: { folioSigem: folio }
        });
        p.estado = 'CERRADO';
        p.log.push({ fecha: new Date().toISOString(), autor: 'Operador', accion: 'cerrado', nota: 'Folio SIGEM recibido: ' + folio + '. Convertido en ciclo correctivo.' });
        await DB.put('pendientes', p);
        await registrarEvento({
          equipoId: p.equipoId, tipo: 'PENDIENTE_CERRADO',
          descripcion: 'Cerrado por recepción de folio SIGEM ' + folio,
          responsable: 'Operador'
        });
        m.cerrar();
        U.toast('Ciclo correctivo abierto con folio ' + folio, 'ok');
        UI.render();
      }
    }, 'Recibí el folio SIGEM →'));
  }
  if (p.estado !== 'CERRADO') {
    footers.push(U.el('button', {
      class: 'btn btn-primary',
      onclick: async () => {
        const ok = await U.confirm('¿Cerrar este pendiente?', { titulo: 'Cerrar pendiente' });
        if (!ok) return;
        p.estado = 'CERRADO';
        p.log.push({ fecha: new Date().toISOString(), autor: 'Operador', accion: 'cerrado', nota: 'Cerrado manualmente.' });
        await DB.put('pendientes', p);
        await registrarEvento({
          equipoId: p.equipoId, tipo: 'PENDIENTE_CERRADO',
          descripcion: p.titulo, responsable: 'Operador'
        });
        m.cerrar();
        U.toast('Pendiente cerrado', 'ok');
        UI.render();
      }
    }, 'Cerrar pendiente'));
  }

  const m = UI.modal({
    titulo: p.titulo, ancho: 'large',
    contenido: cont,
    footer: footers
  });
}

    const tipoTxt = c.codigo === 'PM' ? 'PM' : (c.codigo === 'R' || c.codigo === 'RA' ? 'Reprog.' : 'Prog.');

async function cargarPlanillaCompleta(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  try {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const sheet = wb.Sheets[wb.SheetNames.find(n => !/tecnicos/i.test(n))];
    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
    if (rows.length < 2) return U.toast('La planilla está vacía', 'error');
    const headers = rows[0].map(h => String(h).toLowerCase());
    const idxSerie = headers.findIndex(h => h.includes('serie'));
    const idxInv = headers.findIndex(h => h.includes('inv'));
    const idxResp = headers.findIndex(h => h.includes('responsable'));
    if (idxResp < 0) return U.toast('No se encontró la columna Responsable', 'error');

    const tecnicosCanon = new Set(S.tecnicos.filter(t => t.activo).map(t => t.nombreCanonico));
    let aplicadas = 0, sinTec = 0, sinEq = 0, vacias = 0;
    const ops = [];
    for (let r = 1; r < rows.length; r++) {
      const row = rows[r];
      const resp = U.norm(row[idxResp]);
      if (!resp) { vacias++; continue; }
      if (!tecnicosCanon.has(resp)) { sinTec++; continue; }
      const serie = idxSerie >= 0 ? U.norm(row[idxSerie]) : '';
      const inv   = idxInv >= 0 ? U.norm(row[idxInv]) : '';
      const eq = S.equipos.find(e => U.normUpper(e.numeroSerie) === U.normUpper(serie) || U.normUpper(e.numeroInventario) === U.normUpper(inv));
      if (!eq) { sinEq++; continue; }
      const existente = S.asignacionDeEquipoMes(eq.id, UI.mesActual.anio, UI.mesActual.mes);
      const obj = {
        id: existente ? existente.id : U.uuid(),
        equipoId: eq.id,
        anio: UI.mesActual.anio,
        mes: UI.mesActual.mes,
        responsable: resp,
        creadoEn: existente ? existente.creadoEn : new Date().toISOString(),
        actualizadoEn: new Date().toISOString()
      };
      ops.push({ store: 'asignaciones', tipo: 'put', obj });
      aplicadas++;
    }
    if (ops.length > 0) await DB.batchWrite(ops);
    await S.hidratar();
    U.toast(`${aplicadas} asignaciones cargadas · ${sinTec} con técnico no válido · ${sinEq} sin equipo · ${vacias} sin responsable`, aplicadas > 0 ? 'ok' : 'warn');
    UI.render();
  } catch (err) {
    console.error(err);
    U.toast('Error al leer planilla: ' + err.message, 'error');
  }
}

function construirInforme(servicio, mes, anio) {
  const equipos = S.equipos.filter(e => !e.esSlot && e.servicioClinico === servicio);
  const detalle = [];
  let prog = 0, ejec = 0;
  const causales = {};
  let noOp = 0;
  for (const e of equipos) {
    const c = S.celdasDeEquipo(e.id, anio)[mes - 1];
    const ms = S.mantenciones.find(m =>
      !m.eliminado && m.equipoId === e.id &&
      U.parseISO(m.fechaRealEjecucion).getMonth() + 1 === mes &&
      U.parseISO(m.fechaRealEjecucion).getFullYear() === anio);
    if (!['X','R','RA','PM'].includes(c.codigo) && !ms) continue;
    if (['X','R','RA','PM'].includes(c.codigo)) prog++;
    if (ms) {
      if (ms.resultado === 'SI') ejec++;
      else { causales[ms.resultado] = (causales[ms.resultado] || 0) + 1; if (D.CAUSALES[ms.resultado]?.grupo === 'B') ejec++; }
    }
    if (e.estadoOperacional === 'NO_OPERATIVO' || e.estadoOperacional === 'SERVICIO_TECNICO') noOp++;
    detalle.push({
      identificacion: {
        carpeta: e.numeroCarpeta || '—',
        inv: e.numeroInventario || '—',
        serie: e.numeroSerie || '—',
        marcaModelo: (e.marca || '') + ' ' + (e.modelo || '')
      },
      ubicacion: { unidad: e.unidad || '', ubicacion: e.ubicacionFisica || '' },
      resultado: ms ? ms.resultado : '—',
      ejecutor: ms ? ms.ejecutor : '',
      fechaEjecucion: ms ? ms.fechaRealEjecucion : null,
      observaciones: ms ? ms.observacionesTecnico : ''
    });
  }
  return {
    cabecera: { servicioClinico: servicio, mes, anio, fechaGeneracion: U.hoyISO() },
    resumen: {
      totalEquipos: equipos.length, programadas: prog, ejecutadas: ejec,
      porcentaje: prog > 0 ? Math.round((ejec / prog) * 1000) / 10 : 0,
      noOperativos: noOp, causales
    },
    detalleEquipos: detalle
  };
}

        U.el('span', { class: 'badge badge-accent' }, c + ' ×' + n),

      ]));
    }
    body.appendChild(ul);
  }

  body.appendChild(U.el('div', { class: 'label mb-8' }, 'Detalle por equipo'));

    U.el('th', {}, 'Equipo'), U.el('th', {}, 'Resultado'), U.el('th', {}, 'Ejecutor'), U.el('th', {}, 'Observaciones')
  ])]));

    tr.appendChild(U.el('td', {}, [
      U.el('div', { class: 'text-strong' }, d.identificacion.serie),

function enviarPorMail(informe) {
  const c = S.contactos.find(x => x.servicioClinico === informe.cabecera.servicioClinico);
  if (!c || !c.supervisor || !c.supervisor.correo) {
    U.toast('Configura primero el correo del supervisor en Contactos', 'warn');
    UI.go('contactos');
    return;
  }
  const asunto = `Informe MP ${U.nombreMes(informe.cabecera.mes)} ${informe.cabecera.anio} — ${informe.cabecera.servicioClinico}`;
  let cuerpo = `Estimad@ ${c.supervisor.nombre || ''},\n\nAdjunto resumen de mantenciones preventivas de ${U.nombreMes(informe.cabecera.mes)} ${informe.cabecera.anio} para el servicio ${informe.cabecera.servicioClinico}.\n\n`;
  cuerpo += `Equipos: ${informe.resumen.totalEquipos}\n`;
  cuerpo += `Programadas: ${informe.resumen.programadas}\n`;
  cuerpo += `Ejecutadas: ${informe.resumen.ejecutadas}\n`;
  cuerpo += `Cumplimiento: ${informe.resumen.porcentaje}%\n\n`;
  if (Object.keys(informe.resumen.causales).length > 0) {
    cuerpo += `Causales del mes:\n`;
    for (const [k, n] of Object.entries(informe.resumen.causales)) {
      cuerpo += `  ${k} (×${n}): ${D.CAUSALES[k].texto}\n`;
    }
    cuerpo += '\n';
  }
  cuerpo += `Observaciones por equipo:\n`;
  for (const d of informe.detalleEquipos.filter(x => x.observaciones)) {
    cuerpo += `  · ${d.identificacion.serie} (${d.identificacion.marcaModelo}): ${d.observaciones}\n`;
  }
  cuerpo += `\nSaludos cordiales,\nSubdirección de Equipamiento Clínico\nHospital Dr. Hernán Henríquez Aravena`;
  const url = `mailto:${encodeURIComponent(c.supervisor.correo)}?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}`;
  location.href = url;
}

// ═══════════════════════════════════════════════════════════════
UI.views.maestro = function() {
  const wrap = U.el('div');
  wrap.appendChild(U.el('div', { class: 'page-head' }, [
    U.el('div', {}, [
      U.el('h1', { class: 'page-title' }, [document.createTextNode('Cargar '), U.el('em', {}, 'maestro')]),
      U.el('div', { class: 'page-sub' }, 'Plan Mantención Preventiva PMP_2026.xlsm')
    ])
  ]));
  if (S.config.ultimaCargaMaestro) {
    const u = S.config.ultimaCargaMaestro;
    wrap.appendChild(U.el('div', { class: 'aviso aviso-info mb-16' }, [
      U.el('div', {}, `Última carga: ${U.formatDateTimeLargo(u.fecha)} · ${u.filasProg || 0} filas` + (u.origen === 'demo' ? ' · datos demo' : ''))
    ]));
  }

  const drop = U.el('div', { class: 'dropzone' });
  drop.innerHTML = `
    <div class="dropzone-title">Suelta aquí el archivo maestro</div>
    <div class="dropzone-sub">o clic para seleccionar — .xlsm / .xlsx</div>
    <input type="file" accept=".xlsm,.xlsx" style="display:none">`;
  const inp = drop.querySelector('input');
  drop.addEventListener('click', () => inp.click());
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('is-drag'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('is-drag'));
  drop.addEventListener('drop', async (e) => {
    e.preventDefault(); drop.classList.remove('is-drag');
    const f = e.dataTransfer.files[0]; if (f) await procesarArchivo(f);
  });
  inp.addEventListener('change', (e) => { const f = e.target.files[0]; if (f) procesarArchivo(f); });
  wrap.appendChild(drop);

  async function procesarArchivo(file) {
    try {
      const loader = U.el('div', { class: 'loader-bar' });
      wrap.insertBefore(loader, drop);
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: 'array' });
      const { filasProg, filasReg } = IMPORT.parsearWorkbook(wb);
      loader.remove();

      if (S.equipos.length === 0) {
        const ok = await U.confirm(`Se cargarán ${filasProg.length} filas de equipos y ${filasReg.length} de registros históricos. ¿Continuar?`, { titulo: 'Carga inicial' });
        if (!ok) return;
        await IMPORT.cargarInicial(filasProg, filasReg);
        U.toast('Carga inicial completada', 'ok');
        UI.go('inventario');
      } else {
        const diff = IMPORT.detectarDiferencias(filasProg, filasReg);
        mostrarDiff(diff, filasProg);
      }
    } catch (err) {
      console.error(err);
      U.toast('Error al procesar: ' + err.message, 'error');
    }
  }
  return wrap;
};

function mostrarDiff(diff, filasProg) {
  const cont = U.el('div');
  let activa = 'nuevos';
  const tabs = U.el('div', { class: 'tabs' });
  const tabsList = [
    { id: 'nuevos', label: `Nuevos · ${diff.equiposNuevos.length}` },
    { id: 'ausentes', label: `Ausentes · ${diff.equiposAusentes.length}` },
    { id: 'datos', label: `Cambios datos · ${diff.cambiosDatos.length}` },
    { id: 'grilla', label: `Cambios grilla · ${diff.cambiosGrilla.length}` },
    { id: 'inco', label: `Inconsistencias · ${diff.inconsistenciasGrilla.length + diff.inconsistenciasReg.length}`, accent: diff.inconsistenciasGrilla.length + diff.inconsistenciasReg.length > 0 }
  ];
  const body = U.el('div', { style: { maxHeight: '50vh', overflow: 'auto' } });

  function pintarTabs() {
    tabs.innerHTML = '';
    for (const t of tabsList) {
      const el = U.el('div', {
        class: 'tab' + (activa === t.id ? ' is-active' : ''),
        style: t.accent ? { color: 'var(--accent)', fontWeight: '600' } : {},
        onclick: () => { activa = t.id; pintarTabs(); pintarBody(); }
      }, t.label);
      tabs.appendChild(el);
    }
  }
  function pintarBody() {
    body.innerHTML = '';
    if (activa === 'nuevos') {
      if (diff.equiposNuevos.length === 0) body.appendChild(U.el('div', { class: 'empty empty-sub' }, 'Sin equipos nuevos.'));
      for (const f of diff.equiposNuevos) {
        body.appendChild(U.el('div', { class: 'log-actualizacion' }, [
          U.el('div', { class: 'log-actualizacion-meta' }, 'NUEVO'),
          U.el('div', {}, `${f.familia} · ${f.numeroSerie || ''} · ${f.servicio || ''}`)
        ]));
      }
    } else if (activa === 'ausentes') {
      if (diff.equiposAusentes.length === 0) body.appendChild(U.el('div', { class: 'empty empty-sub' }, 'Todos los equipos del sistema están en el maestro.'));
      for (const e of diff.equiposAusentes) {
        body.appendChild(U.el('div', { class: 'log-actualizacion' }, [
          U.el('div', { class: 'log-actualizacion-meta' }, 'AUSENTE EN MAESTRO NUEVO'),
          U.el('div', {}, `${e.familia} · ${e.numeroSerie || e.numeroInventario} · ${e.servicioClinico || ''}`)
        ]));
      }
    } else if (activa === 'datos') {
      if (diff.cambiosDatos.length === 0) body.appendChild(U.el('div', { class: 'empty empty-sub' }, 'Sin cambios en datos.'));
      for (const c of diff.cambiosDatos) {
        const ul = Object.entries(c.cambios).map(([k, v]) => `${k}: ${v.antes || '—'} → ${v.despues || '—'}`).join(', ');
        body.appendChild(U.el('div', { class: 'log-actualizacion' }, [
          U.el('div', { class: 'log-actualizacion-meta' }, c.equipo.numeroSerie || c.equipo.numeroInventario),
          U.el('div', {}, ul)
        ]));
      }
    } else if (activa === 'grilla') {
      if (diff.cambiosGrilla.length === 0) body.appendChild(U.el('div', { class: 'empty empty-sub' }, 'Sin cambios en grilla.'));
      for (const c of diff.cambiosGrilla) {
        body.appendChild(U.el('div', { class: 'log-actualizacion' }, [
          U.el('div', { class: 'log-actualizacion-meta' }, `${c.equipo.numeroSerie || c.equipo.numeroInventario} · ${U.nombreMes(c.mes)}`),
          U.el('div', {}, `${c.antes} → ${c.despues}`)
        ]));
      }
    } else if (activa === 'inco') {
      const todas = [...diff.inconsistenciasGrilla, ...diff.inconsistenciasReg];
      if (todas.length === 0) body.appendChild(U.el('div', { class: 'empty empty-sub' }, 'Sin inconsistencias.'));
      else body.appendChild(U.el('div', { class: 'aviso aviso-accent mb-12', html: 'Se generará un <strong>pendiente</strong> por cada inconsistencia para que decidas qué versión es la correcta.' }));
      for (const i of todas) {
        const div = U.el('div', { class: 'log-actualizacion' });
        div.appendChild(U.el('div', { class: 'log-actualizacion-meta' }, `${i.equipo.numeroSerie || i.equipo.numeroInventario} · ${U.nombreMes(i.mes)}`));
        const dr = U.el('div', { class: 'diff-row' });
        dr.appendChild(U.el('div', {}, [
          U.el('div', { class: 'text-xs text-muted' }, 'Sistema (operador)'),
          U.el('div', { class: 'diff-conflict' }, i.registrado)
        ]));
        dr.appendChild(U.el('div', {}, [
          U.el('div', { class: 'text-xs text-muted' }, 'Maestro nuevo'),
          U.el('div', { class: 'diff-new' }, i.maestroNuevo)
        ]));
        dr.appendChild(U.el('div', { class: 'text-xs text-muted' }, '→ pendiente generado'));
        div.appendChild(dr);
        body.appendChild(div);
      }
    }
  }
  pintarTabs();
  pintarBody();
  cont.appendChild(tabs);
  cont.appendChild(body);

  const m = UI.modal({
    titulo: 'Cambios detectados vs sistema',
    ancho: 'xlarge', contenido: cont,
    footer: [
      U.el('button', { class: 'btn', onclick: () => m.cerrar() }, 'No aplicar'),
      U.el('button', { class: 'btn btn-primary', onclick: async () => {
        await IMPORT.aplicarDiff(diff, filasProg);
        m.cerrar();
        U.toast('Cambios aplicados', 'ok');
        UI.go('inventario');
      }}, 'Aplicar cambios')
    ]
  });
}

UI.views.respaldos = function() {
  const wrap = U.el('div');
  wrap.appendChild(U.el('div', { class: 'page-head' }, [
    U.el('div', {}, [
      U.el('h1', { class: 'page-title' }, [document.createTextNode('Respaldos '), U.el('em', {}, '')]),
      U.el('div', { class: 'page-sub' }, 'Exportar e importar todo el sistema')
    ])
  ]));

  panel.appendChild(U.el('div', { class: 'panel-body' }, [
    U.el('p', { class: 'mb-16' }, 'El respaldo incluye todos los datos del sistema en un único archivo JSON. Úsalo para hacer copias de seguridad o trasladar el sistema a otro computador.'),
    U.el('div', { class: 'flex gap-12' }, [
      U.el('button', { class: 'btn btn-primary', onclick: exportarTodo }, 'Exportar JSON'),

        document.createTextNode('Importar JSON…'),

    ])

async function exportarTodo() {
  const data = {
    version: 2, generadoEn: new Date().toISOString(),
    equipos: await DB.all('equipos'),
    celdasGrilla: await DB.all('celdasGrilla'),
    mantenciones: await DB.all('mantenciones'),
    ciclos: await DB.all('ciclos'),
    eslabones: await DB.all('eslabones'),
    pendientes: await DB.all('pendientes'),
    asignaciones: await DB.all('asignaciones'),
    contactos: await DB.all('contactos'),
    eventos: await DB.all('eventos'),
    tecnicos: await DB.all('tecnicos'),
    configuracion: await DB.all('configuracion')
  };
  const f = U.formatISO(new Date()).replace(/-/g, '') + '-' + new Date().toTimeString().slice(0,5).replace(':','');
  U.downloadJSON(data, `pmp-respaldo-${f}.json`);
  U.toast('Respaldo descargado', 'ok');
}

async function importarJSON(ev) {
  const f = ev.target.files[0]; if (!f) return;
  const ok = await U.confirm('Esto SOBREESCRIBE los datos actuales del sistema. ¿Continuar?', { titulo: 'Importar respaldo', peligroso: true });
  if (!ok) return;
  try {
    const txt = await f.text();
    const data = JSON.parse(txt);
    await DB.clearAll();
    for (const [store, items] of Object.entries(data)) {
      if (['version','generadoEn'].includes(store)) continue;
      if (Array.isArray(items)) await DB.putMany(store, items);
    }
    await S.hidratar();
    U.toast('Respaldo importado', 'ok');
    UI.go('inventario');
  } catch (err) {
    U.toast('Error: ' + err.message, 'error');
  }
}

async function borrarTodo() {
  const ok = await U.confirm('Esto BORRA TODOS los datos del sistema. Esta acción no se puede deshacer. ¿Continuar?', { titulo: 'Borrar todo', peligroso: true, confirmar: 'Borrar todo' });
  if (!ok) return;
  const ok2 = await U.confirm('Confirmación final: ¿BORRAR TODO?', { titulo: 'Confirmar borrado', peligroso: true, confirmar: 'Sí, borrar' });
  if (!ok2) return;
  await DB.clearAll();
  await S.hidratar();
  U.toast('Datos borrados', 'ok');
  UI.go('bienvenida');
}

// 16. DASHBOARD
// ═══════════════════════════════════════════════════════════════
UI.views.dashboard = function() {
  const wrap = U.el('div');
  wrap.appendChild(U.el('div', { class: 'page-head' }, [
    U.el('div', {}, [
      U.el('h1', { class: 'page-title' }, [document.createTextNode('Dashboard '), U.el('em', {}, 'operativo')]),
      U.el('div', { class: 'page-sub' }, U.nombreMes(UI.mesActual.mes) + ' ' + UI.mesActual.anio)
    ])
  ]));

  const equiposActivos = S.equipos.filter(e => !e.esSlot && e.estadoOperacional !== 'DE_BAJA');
  const noOp = equiposActivos.filter(e => e.estadoOperacional === 'NO_OPERATIVO').length;
  const enST = equiposActivos.filter(e => e.estadoOperacional === 'SERVICIO_TECNICO').length;
  const bajas = S.equipos.filter(e => e.estadoOperacional === 'DE_BAJA').length;
  const alertas30 = equiposActivos.filter(e => D.chequearAlerta30Dias(e, S.mantenciones, S.ciclos)).length;
  const cumple = D.calcularCumplimiento(equiposActivos, S.celdas, S.mantenciones, UI.mesActual.anio, UI.mesActual.mes);
  let progAno = 0, ejecAno = 0;
  for (let m = 1; m <= 12; m++) {
    const c = D.calcularCumplimiento(equiposActivos, S.celdas, S.mantenciones, UI.mesActual.anio, m);
    progAno += c.programadas; ejecAno += c.ejecutadas;
  }
  const pctAno = progAno > 0 ? Math.round((ejecAno / progAno) * 1000) / 10 : 0;

  const grid = U.el('div', { class: 'stat-grid' });
  function stat(label, value, extra, klass, onclick) {
    const s = U.el('div', { class: 'stat' + (onclick ? ' is-clickable' : ''), onclick });
    s.appendChild(U.el('div', { class: 'stat-label' }, label));
    s.appendChild(U.el('div', { class: 'stat-value' + (klass ? ' ' + klass : '') }, String(value)));
    if (extra) s.appendChild(U.el('div', { class: 'stat-extra' }, extra));
    return s;
  }
  grid.appendChild(stat('Equipos activos', equiposActivos.length));
  grid.appendChild(stat('Cumplimiento mes', cumple.porcentaje + '%', `${cumple.ejecutadas}/${cumple.programadas}`, cumple.porcentaje >= 80 ? 'is-ok' : 'is-warn'));
  grid.appendChild(stat('Cumplimiento año', pctAno + '%', `${ejecAno}/${progAno}`, pctAno >= 80 ? 'is-ok' : 'is-warn'));
  grid.appendChild(stat('No operativos', noOp, 'clic para ver', noOp > 0 ? 'is-accent' : '', () => {
    UI.filtroInventario = { ...UI.filtroInventario, estado: 'NO_OPERATIVO', query: '', familia: '', servicio: '' };
    UI.go('inventario');
  }));
  grid.appendChild(stat('En servicio técnico', enST, 'clic para ver', enST > 0 ? 'is-warn' : '', () => {
    UI.filtroInventario = { ...UI.filtroInventario, estado: 'SERVICIO_TECNICO', query: '', familia: '', servicio: '' };
    UI.go('inventario');
  }));
  grid.appendChild(stat('Alerta 30 días', alertas30, 'sin acción tras causal', alertas30 > 0 ? 'is-accent' : '', () => {
    UI.filtroInventario = { ...UI.filtroInventario, soloAlerta: true, query: '', familia: '', servicio: '', estado: '' };
    UI.go('inventario');
  }));
  grid.appendChild(stat('Pendientes', S.pendientesAbiertos().length, 'clic para ver', S.pendientesAbiertos().length > 0 ? 'is-accent' : '', () => UI.go('pendientes')));
  grid.appendChild(stat('Ciclos abiertos', S.ciclos.filter(c => c.estado === 'ABIERTO').length, 'clic para ver', '', () => UI.go('ciclos')));
  grid.appendChild(stat('De baja', bajas));
  wrap.appendChild(grid);

  // Cumplimiento por servicio (mes)
  const servicios = U.unique(equiposActivos.map(e => e.servicioClinico).filter(Boolean)).sort();
  const panel = U.el('div', { class: 'panel' });
  panel.appendChild(U.el('div', { class: 'panel-head' }, [U.el('h3', { class: 'panel-title' }, 'Cumplimiento por servicio · ' + U.nombreMes(UI.mesActual.mes))]));
  const body = U.el('div', { class: 'panel-body dense' });
  const tabla = U.el('table');
  tabla.appendChild(U.el('thead', {}, [U.el('tr', {}, [
    U.el('th', {}, 'Servicio'), U.el('th', {}, 'Programadas'), U.el('th', {}, 'Ejecutadas'), U.el('th', {}, '%'), U.el('th', {}, '')
  ])]));
  const tbody = U.el('tbody');
  for (const s of servicios) {
    const eqs = equiposActivos.filter(e => e.servicioClinico === s);
    const c = D.calcularCumplimiento(eqs, S.celdas, S.mantenciones, UI.mesActual.anio, UI.mesActual.mes);
    const tr = U.el('tr');
    tr.appendChild(U.el('td', { class: 'col-strong' }, s));
    tr.appendChild(U.el('td', { class: 'col-num' }, String(c.programadas)));
    tr.appendChild(U.el('td', { class: 'col-num' }, String(c.ejecutadas)));
    tr.appendChild(U.el('td', { class: 'col-num' }, c.porcentaje + '%'));
    tr.appendChild(U.el('td', {}, U.el('button', { class: 'btn btn-sm btn-ghost', onclick: () => UI.go('informes') }, 'Informe →')));
    tbody.appendChild(tr);
  }
  tabla.appendChild(tbody);
  body.appendChild(tabla);
  panel.appendChild(body);
  wrap.appendChild(panel);
  return wrap;
};

/* =========================================================================
   A7 — INICIALIZACIÓN
   ========================================================================= */

async function init() {
  try {
    await DB.open();
    await S.hidratar();

    // Botón de grabación
    const recBtn = document.getElementById('rec-btn');
    if (recBtn) {
      recBtn.addEventListener('click', async () => {
        if (REC.activo) {
          await REC.stop();
        } else {
          REC.start();
        }
      });
    }

    // Ruta inicial: bienvenida si está vacío, inventario si hay datos
    if (S.equipos.length === 0) {
      UI.go('bienvenida');
    } else {
      UI.go('inventario');
    }
  } catch (err) {
    console.error('Error al inicializar:', err);
    const errCont = document.getElementById('main') || document.body;
    errCont.innerHTML = `
      <div style="padding:40px;text-align:center;color:#c84e3d;font-family:system-ui">
        <h2>Error al iniciar la aplicación</h2>
        <p>${err.message}</p>
        <pre style="text-align:left;background:#f5efe3;padding:16px;border-radius:8px;overflow:auto;max-width:800px;margin:20px auto">${err.stack || ''}</pre>
      </div>
    `;
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
